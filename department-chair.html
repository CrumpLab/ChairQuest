<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Office of the Chair</title>
<style>
  :root{
    --paper: #e9e1cb;
    --paper-dark: #ded4b8;
    --ink: #2a2620;
    --navy: #22314a;
    --oxblood: #7a2e2e;
    --manila: #c9a66b;
    --line: #b8ab84;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--paper-dark);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  .desk{
    max-width: 720px;
    margin: 28px auto 60px;
    padding: 0 16px;
  }
  .memo{
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(0,0,0,0.18);
    padding: 28px 32px 24px;
    position: relative;
  }
  .memo::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:6px;
    background: var(--navy);
  }
  .letterhead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 10px; margin-bottom: 18px;
  }
  .letterhead h1{
    font-size: 20px; margin:0; letter-spacing:0.3px; color: var(--navy); font-weight:700;
  }
  .letterhead .sub{
    font-size: 12.5px; color:#5a5340; font-style: italic;
  }
  .letterhead .stamp{
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 11px; text-align:right; color:#5a5340; line-height:1.5;
    white-space:nowrap;
  }
  .gauges{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px 22px;
    margin-bottom: 20px;
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 12px;
  }
  .gauge-row{ }
  .gauge-label{
    display:flex; justify-content:space-between; margin-bottom:3px; color:#463f2f;
  }
  .gauge-track{
    height: 9px; background: #d8cba7; border:1px solid var(--line); position:relative;
  }
  .gauge-fill{
    height:100%; background: var(--navy);
  }
  .gauge-fill.low{ background: var(--oxblood); }
  .gauge-fill.mid{ background: var(--manila); }
  .week{
    font-family:'Courier New',monospace; font-size:12px; color:#5a5340;
    text-align:right; margin-bottom:6px;
  }
  .scene-title{
    font-size: 17px; font-weight:700; margin: 0 0 8px; color: var(--oxblood);
  }
  .scene-text{
    font-size: 15.5px; line-height:1.55; margin-bottom: 18px;
  }
  .choices{
    display:flex; flex-direction:column; gap:8px;
  }
  .choice-btn{
    text-align:left;
    background: var(--paper);
    border:1px solid var(--navy);
    padding: 10px 14px;
    font-family: Georgia, serif;
    font-size: 14.5px;
    color: var(--ink);
    cursor:pointer;
    transition: background 0.12s, transform 0.05s;
  }
  .choice-btn .tag{
    font-family:'Courier New',monospace; font-size:11px; color: var(--oxblood); margin-right:8px;
  }
  .choice-btn:hover{
    background: var(--manila);
  }
  .choice-btn:active{ transform: translateY(1px); }
  .consequence{
    font-family:'Courier New',monospace;
    font-size:12px;
    color: var(--navy);
    margin-top:14px;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    white-space:pre-line;
  }
  .continue-btn{
    margin-top:16px;
    display:inline-block;
    background: var(--navy);
    color: var(--paper);
    border:none;
    padding: 9px 18px;
    font-family:'Courier New',monospace;
    font-size:12.5px;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .continue-btn:hover{ background:#2c4060; }
  .start-screen h1{
    font-size: 24px; color: var(--navy); margin-bottom:4px;
  }
  .start-screen p{
    font-size:15px; line-height:1.6;
  }
  .field-row{
    display:flex; flex-direction:column; gap:4px; margin: 14px 0;
  }
  .field-row label{
    font-family:'Courier New',monospace; font-size:11.5px; color:#5a5340;
  }
  .field-row input{
    font-family: Georgia, serif;
    font-size:15px;
    padding:7px 9px;
    border:1px solid var(--navy);
    background:#fdfaf0;
  }
  .end-title{
    font-size:21px; color:var(--oxblood); margin-bottom:6px;
  }
  .end-stats{
    font-family:'Courier New',monospace; font-size:12px; color:#463f2f;
    margin: 14px 0; line-height:1.7;
  }
  .footer-note{
    text-align:center; font-family:'Courier New',monospace; font-size:11px;
    color:#7a715a; margin-top:14px;
  }
</style>
</head>
<body>
<div class="desk">
  <div class="memo" id="memo"></div>
  <div class="footer-note">OFFICE OF THE CHAIR &middot; INTERNAL CORRESPONDENCE &middot; RETAIN FOR YOUR FILES</div>
</div>

<script>
const STATE = {
  chairName: "",
  deptName: "",
  week: 0,
  totalWeeks: 10,
  stats: { pc: 50, bud: 50, mor: 50, dean: 50 },
  log: [],
  scenarios: [],
  forcedEnding: null,
  pendingBonus: null,
  bonusFired: { pc:false, bud:false, mor:false, dean:false }
};

function clamp(n){ return Math.max(0, Math.min(100, n)); }

function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function applyEffects(effects){
  for(const k in effects){ STATE.stats[k] = clamp(STATE.stats[k] + effects[k]); }
}

const STAT_LABELS = {
  pc: "Political Capital",
  bud: "Budget Health",
  mor: "Faculty Morale",
  dean: "Dean's Confidence"
};

// ---------------- SCENARIO DATA ----------------
const SCENARIOS = [
{
  title: "Orientation Memo",
  text: (S) => `Your appointment letter is barely dry. The outgoing chair left you three things: a filing cabinet with no working key, a department budget spreadsheet last updated two years ago, and a sticky note reading "good luck, you'll need it." Your first task is to submit a "Chair's Priorities" memo to the Dean's office by Friday.`,
  choices: [
    { label:"Propose an ambitious agenda: new hires, curriculum overhaul, a speaker series.", tag:"A",
      effects:{pc:5, dean:8, bud:-6, mor:2},
      result:"The Dean is pleased to see initiative. Faculty are wary of promises they've heard before." },
    { label:"Submit a modest, low-risk memo focused on 'stability and continuity.'", tag:"B",
      effects:{pc:2, dean:2, bud:2, mor:6},
      result:"Faculty appreciate that you're not lurching toward change. The Dean's office barely notices you." },
    { label:"Quietly ask three senior faculty what they actually want before writing anything.", tag:"C",
      effects:{pc:8, mor:8, dean:-2},
      result:"Faculty are flattered to be consulted. The Dean's office grumbles about the delay." },
    { label:"Put the memo aside and track down a locksmith for that filing cabinet first.", tag:"D",
      effects:{dean:-6, pc:-3},
      result:"The locksmith never picks up the phone. You waste two mornings walking the block trying to find the shop's actual address, only to discover it's been closed indefinitely over a health and safety violation. The memo goes in late, and the cabinet stays locked." }
  ]
},
{
  title: "The Curriculum Committee Divides",
  text: (S) => `Your curriculum committee has split into two camps: one wants to fold a popular but under-enrolled seminar into a new interdisciplinary gateway course, the other insists this "waters down the major." Both factions have cornered you separately this week, and the vote is Thursday.`,
  choices: [
    { label:"Back the interdisciplinary redesign — it plays well with enrollment metrics upstairs.", tag:"A",
      effects:{dean:10, mor:-8, pc:-3},
      result:"The Dean's office notes your responsiveness to enrollment data. The traditionalist faction feels betrayed." },
    { label:"Defend the existing major and let the seminar survive on its reputation.", tag:"B",
      effects:{mor:9, dean:-7, pc:2},
      result:"Faculty feel you have their back. The Dean's office quietly flags the department as 'resistant to change.'" },
    { label:"Broker a compromise: pilot the gateway course for two years, review the data together.", tag:"C",
      effects:{pc:6, mor:3, dean:3, bud:-3},
      result:"Nobody is thrilled, but nobody walks out of the meeting either. You've bought time — and spent a favor doing it." },
    { label:"Take an urgent call from the Provost about an unrelated crisis instead of sitting in on the vote.", tag:"D",
      effects:{pc:-3, dean:-2, mor:-4},
      result:"By the time you're off the phone, the vote is moot: the committee chair rejected both proposals outright over formatting issues with the submitted documents. Nothing is decided, and both factions quietly blame you for not being in the room." }
  ]
},
{
  title: "A Contested Tenure Case",
  text: (S) => `Dr. Alvarez's tenure case has split the department's external letters: two glowing, one lukewarm, one openly hostile — written, you suspect, by someone still nursing a decade-old grudge over a shared lab space. The vote is close, and everyone is watching how you frame the discussion.`,
  choices: [
    { label:"Convene the committee and let the vote happen on the record, without steering it.", tag:"A",
      effects:{pc:4, mor:2, dean:1},
      result:"You avoid the appearance of thumb-on-the-scale. The vote passes narrowly, and the losing faction remembers your neutrality — for better or worse." },
    { label:"Privately advocate for Alvarez, citing the weak letter's obvious bias.", tag:"B",
      effects:{mor:9, pc:-4, dean:-3},
      result:"Alvarez's supporters are grateful. A colleague files a quiet complaint that you 'influenced the process.'" },
    { label:"Ask the Dean's office to order a fifth, independent external letter before the vote.", tag:"C",
      effects:{dean:5, bud:-4, mor:-2},
      result:"The delay irritates everyone equally, which — in a strange way — is its own kind of fairness." },
    { label:"Since Alvarez's subfield is well outside your own, hold forth instead on the general vagaries and biases of external review.", tag:"D",
      effects:{pc:-3, mor:-3},
      result:"Half the room nods along, relieved someone finally said it out loud. The other half hears a veiled shot at their own scholarship and bristles — you've managed to insult exactly the faculty you weren't talking about." }
  ]
},
{
  title: "The Enrollment Numbers Land",
  text: (S) => `The registrar's report is in: majors are down 14% over three years, mostly first-generation and transfer students choosing "more practical" programs. The Dean's office wants a memo explaining "your plan to reverse this trend" before the budget meeting.`,
  choices: [
    { label:"Propose cutting two low-enrolled electives to fund a new applied-skills course.", tag:"A",
      effects:{dean:9, bud:6, mor:-9},
      result:"The Dean is satisfied you're taking enrollment seriously. Two faculty whose courses were cut stop returning your emails." },
    { label:"Argue the numbers reflect a system-wide trend, not a departmental failure.", tag:"B",
      effects:{dean:-6, mor:5, pc:-2},
      result:"Faculty appreciate you not scapegoating them. The Dean's office notes you 'pushed back on accountability.'" },
    { label:"Launch a joint recruitment push with career services, promising results next year.", tag:"C",
      effects:{bud:-5, pc:5, dean:3, mor:3},
      result:"It costs money you don't fully have, but it buys goodwill on both sides while you wait to see if it works." },
    { label:"Ask an AI tool to draft the memo overnight and send it in without time to review it closely.", tag:"D",
      effects:{dean:-7, pc:-5},
      result:"The memo reads impressively right up until someone in the Dean's office notices it cites a retention study that doesn't exist and recommends launching a 'micro-credential in synergy studies' your department has never taught. It gets forwarded around as a cautionary tale before you even hear about it." }
  ]
},
{
  title: "A Grievance Over Overload",
  text: (S) => `Three adjunct instructors, backed by the union, have filed a grievance: they were assigned a fourth course this semester without the contractually required advance notice or compensation bump. The Associate Dean wants your account of what happened by end of day.`,
  choices: [
    { label:"Acknowledge the error immediately and adjust their pay retroactively.", tag:"A",
      effects:{bud:-6, mor:8, dean:-3},
      result:"The adjuncts are relieved. The Dean's office is irritated by the unplanned expense and the precedent." },
    { label:"Argue the assignments were 'informally agreed to' over email and contest the grievance.", tag:"B",
      effects:{dean:4, mor:-11, bud:2},
      result:"You win a procedural point. Word spreads fast that the chair 'fights its own adjuncts.'" },
    { label:"Escalate to HR and ask for a joint review of how overloads get assigned department-wide.", tag:"C",
      effects:{pc:5, mor:4, dean:-2},
      result:"It's slower and more bureaucratic, but it fixes the actual process instead of just this instance." }
  ]
},
{
  title: "The Viability Review Letter",
  text: (S) => `A letter arrives from the Provost's office: your department has been flagged for a "program viability review" alongside two others, citing cost-per-credit-hour. You have three weeks to prepare a response before a committee — mostly administrators from outside your discipline — makes a recommendation.`,
  choices: [
    { label:"Mobilize faculty governance allies to publicly question the review's methodology.", tag:"A",
      effects:{pc:7, dean:-9, mor:6},
      result:"The senate raises real concerns about the metrics used. The Provost's office does not appreciate being challenged in public." },
    { label:"Prepare a data-heavy, cooperative response emphasizing efficiency improvements you'll make.", tag:"B",
      effects:{dean:8, bud:2, mor:-4},
      result:"The review committee appreciates the tone. Some faculty feel you 'negotiated with the people trying to close us.'" },
    { label:"Quietly reach out to alumni and local employers for letters of support before the hearing.", tag:"C",
      effects:{pc:4, dean:4, bud:1},
      result:"External validation lands well with the committee, and costs you almost nothing politically." },
    { label:"Blame the administration's opaque budget data for making real viability planning impossible, and rally the other flagged chairs to make the case together.", tag:"D",
      effects:{pc:8, mor:4, dean:-8},
      result:"The other two flagged chairs turn out to have been quietly furious about the same missing cost data for years, and a joint letter reaches the Provost within the week — this is bigger than any one department now. The review committee doesn't appreciate being told the numbers themselves are the problem, and the Provost's office quietly marks all three of you as 'coordinating against the process.'" }
  ]
},
{
  title: "A Call From the State House",
  text: (S) => `A state legislator's staffer calls, then emails, asking pointed questions about a course reading list that "constituents have raised concerns about." Local news has picked up the story. Your Dean forwards the email with one line: "Handle this carefully."`,
  choices: [
    { label:"Publicly defend the instructor's academic freedom and the course as designed.", tag:"A",
      effects:{mor:10, dean:-8, pc:-3},
      result:"Faculty rally behind you. The Dean's office is now fielding calls you didn't expect to generate." },
    { label:"Quietly ask the instructor to add 'alternative perspective' readings to defuse the story.", tag:"B",
      effects:{dean:6, mor:-10, pc:2},
      result:"The story dies down within a week. The instructor never quite trusts your judgment again." },
    { label:"Refer all inquiries to the university's general counsel and legal/media office.", tag:"C",
      effects:{pc:3, dean:3, mor:1},
      result:"It's the boring answer, but it keeps you out of the crossfire almost entirely." },
    { label:"Treat it as free publicity and post enthusiastically about the course on LinkedIn.", tag:"D",
      effects:{pc:4, mor:6, dean:-12},
      result:"Your post — 'Proud of our faculty for teaching without fear!' — collects thousands of likes within a day, half from supportive alumni and half from constituents tagging the legislator's office directly in the comments. The story is now trending statewide, and the Dean's office is fielding calls from people who'd never heard of your department yesterday." }
  ]
},
{
  title: "One Retirement, One Fight",
  text: (S) => `Professor Kowalski's retirement opens a rare tenure-line hire. Your senior faculty member wants a replacement in her subfield to keep the concentration alive; two junior faculty argue the department desperately needs someone with strong digital skills to stay "relevant" to enrollment. The Dean will only approve one line.`,
  choices: [
    { label:"Back the traditional subfield hire — protect what's historically strong.", tag:"A",
      effects:{mor:5, dean:-4, bud:0},
      result:"Senior faculty are relieved their field survives. The junior faculty feel the department is choosing the past over the future." },
    { label:"Back the hire with strong digital skills, citing enrollment and grant potential.", tag:"B",
      effects:{dean:8, mor:-6, pc:1},
      result:"The Dean's office loves the pitch. It will take years to know if the bet pays off — and someone's field just quietly ended." },
    { label:"Ask the Dean for a compromise: a joint appointment split across two departments.", tag:"C",
      effects:{pc:6, dean:2, mor:2, bud:-2},
      result:"It's an unusual ask, but it lets you avoid picking a side outright — for now." }
  ]
},
{
  title: "Governance Fatigue in August",
  text: (S) => `A new university-wide assessment mandate lands in your inbox in mid-August, with a comment period that closes before the semester even starts. Almost no one on the senate's curriculum subcommittee is reachable. You suspect this timing is not an accident.`,
  choices: [
    { label:"Flag the timing publicly to senate leadership and request an extension.", tag:"A",
      effects:{pc:6, dean:-5, mor:4},
      result:"The extension is granted, grudgingly. Someone in the Provost's office now considers you 'a process person.'" },
    { label:"Quietly comply and draft the department's response yourself over the weekend.", tag:"B",
      effects:{dean:5, mor:-3, pc:-2},
      result:"It's done on time, and nobody but you knows what it cost you personally." },
    { label:"Ignore the deadline; let the mandate default to a generic boilerplate response.", tag:"C",
      effects:{dean:-6, pc:-2, mor:1},
      result:"It's the path of least effort — and the Dean's office notices departments that treat mandates as optional." },
    { label:"Hand the whole response off to your deputy chair to draft.", tag:"D",
      effects:{mor:-7, pc:-2, dean:-3},
      result:"Your deputy spends two solid weekends building a meticulous response — then the university revises the mandate's requirements with four days' notice, rendering most of it moot. They are not shy about letting you know exactly how they feel about redoing it from scratch." }
  ]
},
{
  title: "The Annual Report",
  text: (S) => `Spring closes with the ritual all chairs dread: the annual report to the Dean, summarizing the year and stating whether you intend to continue in the role. Faculty, staff, and the Dean's office are all quietly forming their own private verdicts on how this year went.`,
  choices: [
    { label:"Write an honest report — successes, failures, and the fights that are still unresolved.", tag:"A",
      effects:{pc:4, dean:2, mor:3},
      result:"It's not the most flattering document you've ever written, but it's the one people trust." },
    { label:"Write a polished, achievement-forward report emphasizing everything that went well.", tag:"B",
      effects:{dean:6, mor:-3},
      result:"The Dean's office likes it. A colleague who lived through this year privately calls it 'creative writing.'" },
    { label:"Ask three faculty to co-sign the report with you, sharing both credit and blame.", tag:"C",
      effects:{mor:7, pc:3, dean:1},
      result:"It's an unusual move, and it lands as a sign that you see this as a shared project, not just your résumé." },
    { label:"Use the report to catalogue, in detail, everywhere the administration failed the department this year.", tag:"D",
      effects:{mor:8, pc:5, dean:-9},
      result:"The report is thorough, sharply argued, and reads less like a self-assessment than an indictment. The Dean doesn't push back on the substance — instead, he quietly starts treating you like someone angling for a seat in the administration rather than someone content running a department, and stops sharing things off the record." }
  ]
},
{
  title: "The Cross-Listing Turf War",
  text: (S) => `The Sociology chair wants to cross-list your most popular seminar so it counts toward both departments' enrollment numbers. Your faculty see it as free-riding on a course they built; the Dean's office sees a tidy way to make two departments' numbers look better on paper.`,
  choices: [
    { label:"Agree, but insist your department gets sole credit for the enrollment count.", tag:"A",
      effects:{dean:5, pc:-3, mor:2},
      result:"Sociology's chair is annoyed, but the Dean's office likes that you found a way to say yes." },
    { label:"Refuse outright — the course stays yours, full stop.", tag:"B",
      effects:{mor:6, dean:-5, pc:-2},
      result:"Your faculty feel protected. You've made an enemy in Sociology who now sits on your college's budget subcommittee." },
    { label:"Propose splitting the enrollment credit fifty-fifty going forward.", tag:"C",
      effects:{pc:-3, dean:-4, mor:-6, bud:-3},
      result:"The split looks fine on paper until the registrar's cancellation sweep: Sociology's half of the cross-listing comes in under the minimum, and the whole course gets automatically pulled from the schedule — even though your section alone had more than enough students to run it." }
  ]
},
{
  title: "The AI Plagiarism Case",
  text: (S) => `A professor flags a student's final paper as "obviously AI-generated," but the detection software's report is inconclusive and the student is adamant it's their own work. The student's parent, a lawyer, has already emailed twice.`,
  choices: [
    { label:"Support the faculty member's judgment and uphold the academic integrity charge.", tag:"A",
      effects:{mor:5, dean:-2, pc:-3},
      result:"Faculty feel backed. The parent's emails escalate to the Provost's office, citing 'unreliable software' as evidence." },
    { label:"Ask for a live oral defense of the paper as a fairer alternative to the software report.", tag:"B",
      effects:{pc:6, mor:2, dean:1},
      result:"It's more work, but it settles the question more convincingly than any detector could." },
    { label:"Quietly encourage the professor to let it go given the weak evidence.", tag:"C",
      effects:{mor:-7, dean:3},
      result:"The complaint disappears. So does the professor's trust that you'll back tough calls." }
  ]
},
{
  title: "The Harassment Complaint",
  text: (S) => `A graduate student has filed a complaint with the Title IX office against a senior, well-funded faculty member. You're informed only that "an investigation is underway" and asked not to discuss it — while that same faculty member keeps asking you, directly, what's going on.`,
  choices: [
    { label:"Tell him plainly that you can't discuss an active investigation, full stop.", tag:"A",
      effects:{dean:6, mor:-3, pc:2},
      result:"He's furious at the silence. The Title IX office notes your department handled it correctly." },
    { label:"Quietly reassign his advisees to other faculty 'as a precaution' before any finding.", tag:"B",
      effects:{mor:4, dean:-4, pc:-2},
      result:"Students feel protected. He accuses you of prejudging an unresolved case, and he's not entirely wrong." },
    { label:"Do nothing differently until the investigation formally concludes.", tag:"C",
      effects:{dean:3, mor:-6},
      result:"It's procedurally correct and it makes several students in the program deeply uneasy in the meantime." }
  ]
},
{
  title: "Accreditation Site Visit",
  text: (S) => `The programmatic accreditors arrive in six weeks, and your last self-study binder was assembled by someone who retired in 2019. The visit determines whether your program keeps its accreditation — and whether students can keep qualifying for certain licensure exams.`,
  choices: [
    { label:"Pull two faculty off their normal service duties to rebuild the self-study properly.", tag:"A",
      effects:{dean:7, mor:-5, bud:-2},
      result:"The binder is genuinely strong. The two faculty you conscripted are quietly resentful for the rest of the semester." },
    { label:"Hire a part-time consultant who specializes in accreditation reports.", tag:"B",
      effects:{dean:5, mor:2, pc:-5},
      result:"There's no line item anywhere for this. Rather than let the visit go sideways, you quietly cover the consultant's fee yourself out of a sense of duty nobody asked you to have. The binder is the smoothest you've ever seen — and you're fairly certain a reimbursement request would go nowhere, so you never file one." },
    { label:"Assemble it yourself over several very long nights.", tag:"C",
      effects:{pc:-2, dean:3, mor:3},
      result:"Faculty appreciate that you didn't dump it on them. You are exhausted for a month afterward." }
  ]
},
{
  title: "The Guest Speaker Controversy",
  text: (S) => `A faculty member's invited speaker for the colloquium series has a history of inflammatory public statements. A student group is organizing a protest; a different student group is organizing a counter-letter defending the invitation on academic-freedom grounds.`,
  choices: [
    { label:"Let the talk proceed as scheduled and add a moderated Q&A for pointed questions.", tag:"A",
      effects:{mor:5, dean:-4, pc:2},
      result:"Faculty feel their academic judgment was respected. The Dean's office fields angry calls for a week." },
    { label:"Ask the faculty host to postpone 'for scheduling reasons.'", tag:"B",
      effects:{dean:5, mor:-8, pc:-3},
      result:"The controversy quietly dissolves. The host never quite forgives the transparent excuse." },
    { label:"Add a second, opposing speaker to the same event as a 'balance' measure.", tag:"C",
      effects:{pc:3, dean:1, mor:-2},
      result:"Almost nobody is satisfied by the compromise, which is at least evenly distributed." }
  ]
},
{
  title: "The Open-Textbook Mandate",
  text: (S) => `The Provost's office announces a push toward "zero-cost" open educational resources in gateway courses, citing student debt concerns. Faculty who've spent years refining their syllabi around a specific (non-free) textbook are not pleased about redoing their prep work for free.`,
  choices: [
    { label:"Mandate the switch for all gateway sections next semester.", tag:"A",
      effects:{dean:8, mor:-9, bud:3},
      result:"Students save real money. Faculty spend their summer rebuilding courses they didn't ask to rebuild." },
    { label:"Make it optional and highlight faculty who volunteer to switch as models for others.", tag:"B",
      effects:{mor:5, dean:-3, pc:2},
      result:"Adoption is slow but voluntary, and nobody feels ambushed by the policy." },

          result:"It's not a perfect system, but it's one nobody can accuse you of rigging in anyone's favor." },
        { label:"Hand-pick the strongest committee possible and thank the rest personally.", tag:"B",
          effects:{mor:-3, dean:4},
          result:"The resulting committees are excellent. A few of the faculty you passed over quietly note that enthusiasm apparently wasn't enough." },
        { label:"Create an extra, informal advisory seat so nobody is technically turned away.", tag:"C",
          effects:{bud:-2, mor:5},
          result:"It's an improvised fix that costs you almost nothing and makes the rare problem of too much goodwill disappear neatly." }
      ]
    }
  ],
  dean: [
    {
      title: "A Rare Vote of Trust",
      text: (S) => `The Dean's office is sufficiently pleased with you that they offer something unusual: discretion. A pool of small decisions — course caps, minor budget shuffles, a hire timeline — that normally require sign-off is quietly handed to you to manage on your own judgment, "given your track record."`,
      choices: [
        { label:"Use the new discretion generously to fix small, long-standing faculty annoyances.", tag:"A",
          effects:{mor:9, dean:-3},
          result:"Faculty notice things suddenly moving faster. The Dean's office notices you using the leash they gave you to its full length." },
        { label:"Use it sparingly and only for the most defensible calls.", tag:"B",
          effects:{dean:5, pc:2},
          result:"Nothing goes wrong, which is precisely the point of having been trusted with it in the first place." },
        { label:"Quietly delegate the new authority to your associate chair, to build their standing too.", tag:"C",
          effects:{mor:5, pc:3, dean:-2},
          result:"It's a generous move that costs you some direct credit — and earns you a genuinely loyal deputy." }
      ]
    },
    {
      title: "An Off-Book Ask",
      text: (S) => `The Dean pulls you aside after a meeting, not for anything on the agenda, but to quietly ask if you'd be willing to smooth over a sensitive personnel situation in another department — informally, off the record, because "you're good at this."`,
      choices: [
        { label:"Agree to help quietly, as asked.", tag:"A",
          effects:{dean:6, pc:3, mor:-3},
          result:"You handle it well, and it costs you time and goodwill nobody in your own department will ever know you spent." },
        { label:"Agree, but only if it's documented properly through normal channels.", tag:"B",
          effects:{dean:-2, pc:4},
          result:"The Dean is faintly annoyed at the insistence on paperwork. You sleep better at night regardless." },
        { label:"Decline — your own department has enough that actually needs you.", tag:"C",
          effects:{dean:-5, mor:3},
          result:"It's the boundary you probably should have set months ago. The Dean's office notes it, and not entirely approvingly." }
      ]
    },
    {
      title: "The Speaking Slot",
      text: (S) => `The Dean asks you to represent the college at an external event — a legislative breakfast, alumni gala, or peer-institution panel — the kind of visibility that's usually reserved for deans and vice provosts, not department chairs.`,
      choices: [
        { label:"Accept, and use the platform to advocate directly for your department's needs.", tag:"A",
          effects:{dean:-3, pc:6, bud:2},
          result:"It's a little bold for the room, and it's also the first time in years anyone outside the building has heard your department's actual case made out loud." },
        { label:"Accept, and stick closely to the safe, generic talking points you're given.", tag:"B",
          effects:{dean:5, pc:1},
          result:"It goes smoothly and forgettably, which is exactly what the Dean's office was hoping for." },
        { label:"Suggest a faculty member who'd benefit more from the visibility, and send them instead.", tag:"C",
          effects:{mor:6, dean:1},
          result:"It's a generous move, and the faculty member you sent won't forget who gave them the opportunity." }
      ]
    }
  ]
};

function checkBonusTrigger(){
  for(const k of ["pc","bud","mor","dean"]){
    if(STATE.stats[k] > 75 && !STATE.bonusFired[k]){
      STATE.bonusFired[k] = true;
      const pool = BONUS_SCENARIOS[k];
      return pool[Math.floor(Math.random() * pool.length)];
    }
  }
  return null;
}

// ---------------- ENDINGS ----------------
const ZERO_ENDINGS = {
  dean: {
    title: "Terminated With Cause",
    text: `The Provost's office moves faster than anyone expected. By Friday afternoon, campus security has already re-keyed your office door — the one that still doesn't fit the old filing cabinet. There is no exit interview, barely an email. Someone else will be Chair by Monday, and the memos will simply resume as if you were never the one writing them.`
  },
  bud: {
    title: "The Books Don't Close",
    text: `The department's accounts run so far into the red that the Provost's office stops asking about spending priorities and starts asking about receivership. An external financial monitor is assigned to co-sign every purchase order from here on. You are still, technically, the Chair. You are also, as of this week, no longer the one actually running the department.`
  },
  mor: {
    title: "The Department Revolts",
    text: `It doesn't happen all at once, and then it does: three faculty file formal no-confidence complaints in the same week, two more stop attending meetings altogether, and a fourth is quietly interviewing elsewhere. The Dean's office intervenes directly — not to save your chairship, but to keep the department from coming apart around it.`
  },
  pc: {
    title: "Persona Non Grata",
    text: `It's a strange kind of ending — nothing dramatic happens, exactly. Meetings you used to be invited to happen without you. Emails you used to be copied on go out without your name in the header. You are still Chair on paper. In every room that actually matters, you've already been quietly replaced by the org chart itself.`
  }
};

function checkZeroEnding(){
  for(const k of ["dean","bud","mor","pc"]){
    if(STATE.stats[k] <= 0) return ZERO_ENDINGS[k];
  }
  return null;
}

function computeEnding(){
  const s = STATE.stats;
  const avg = (s.pc + s.bud + s.mor + s.dean) / 4;

  if(s.dean < 25){
    return {
      title: "Not Renewed",
      text: `The Dean's office thanks you for your service and informs you, with practiced regret, that the department will "benefit from new leadership" next year. Your former colleagues throw you a small, slightly awkward reception. You did not lose control of the department — you lost the confidence of the people who fund it, one memo at a time.`
    };
  }
  if(s.mor < 25){
    return {
      title: "Vote of No Confidence",
      text: `At the final department meeting of the year, a motion is raised — and passes — expressing no confidence in your chairship. It isn't personal, several colleagues insist afterward, unconvincingly. You governed the department. You never quite led it.`
    };
  }
  if(s.bud < 25){
    return {
      title: "Absorbed",
      text: `The Provost's office announces your department will be "consolidated" into a new School of Interdisciplinary Studies effective next fall. Your faculty keep their jobs. Your letterhead does not survive the transition.`
    };
  }
  if(avg >= 70){
    return {
      title: "The Dean's Office Calls",
      text: `Late one afternoon, the Dean's chief of staff calls to ask, off the record, whether you'd consider a nomination for Associate Dean. You navigated a genuinely difficult year — factions, finances, and a legislature with opinions — and somehow most people still return your calls. Whether that's a promotion or a punishment, you'll find out next year.`
    };
  }
  if(avg >= 50){
    return {
      title: "You Return in the Fall",
      text: `The year ends the way most chair years do: unresolved in a dozen small ways, survivable in the ways that count. Nobody throws you a parade. Nobody calls for your resignation. You'll be back at your desk in August, filing cabinet key still missing, for another year of the same negotiation.`
    };
  }
  return {
    title: "Running on Fumes",
    text: `You finish the year technically intact — still chair, department still open, no formal votes against you — but everyone involved, including you, knows it was closer than the official record will ever show. You start making a list, quietly, of everything you'd do differently.`
  };
}

// ---------------- RENDERING ----------------
function gaugeClass(v){
  if(v < 30) return "low";
  if(v < 60) return "mid";
  return "";
}

function renderGauges(){
  let html = `<div class="gauges">`;
  for(const k of ["pc","bud","mor","dean"]){
    const v = STATE.stats[k];
    html += `
      <div class="gauge-row">
        <div class="gauge-label"><span>${STAT_LABELS[k]}</span><span>${v}</span></div>
        <div class="gauge-track"><div class="gauge-fill ${gaugeClass(v)}" style="width:${v}%"></div></div>
      </div>`;
  }
  html += `</div>`;
  return html;
}

function renderLetterhead(sub){
  return `
    <div class="letterhead">
      <div>
        <h1>${STATE.deptName || "Department of General Studies"}</h1>
        <div class="sub">Office of the Chair${STATE.chairName ? " &mdash; " + STATE.chairName : ""}</div>
      </div>
      <div class="stamp">${sub}</div>
    </div>`;
}

function renderStart(){
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead("NEW APPOINTMENT")}
    <div class="start-screen">
      <h1>Congratulations. You are now Chair.</h1>
      <p>Ten weeks stand between you and the end of your first year &mdash; budgets, tenure cases,
      a curriculum committee at war with itself, and a Dean's office that speaks almost
      entirely in memos. You will not please everyone. You may not please anyone.</p>
      <p>Fill in your appointment details, or leave them blank and we'll assume the usual.</p>
    </div>
    <div class="field-row">
      <label>YOUR NAME</label>
      <input id="chairNameInput" type="text" placeholder="e.g. Dr. Pat Reyes" maxlength="40">
    </div>
    <div class="field-row">
      <label>DEPARTMENT</label>
      <input id="deptNameInput" type="text" placeholder="e.g. Department of Comparative Literature" maxlength="50">
    </div>
    <button class="continue-btn" id="beginBtn">BEGIN TERM &rarr;</button>
  `;
  document.getElementById("beginBtn").onclick = () => {
    STATE.chairName = document.getElementById("chairNameInput").value.trim();
    STATE.deptName = document.getElementById("deptNameInput").value.trim();
    STATE.week = 0;
    STATE.scenarios = shuffled(SCENARIOS).slice(0, STATE.totalWeeks);
    renderScenario();
  };
}

function renderScenario(){
  if(STATE.week >= STATE.scenarios.length){
    renderEnding();
    return;
  }
  const sc = STATE.scenarios[STATE.week];
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead(`WEEK ${STATE.week + 1} OF ${STATE.scenarios.length}`)}
    ${renderGauges()}
    <div class="scene-title">${sc.title}</div>
    <div class="scene-text">${sc.text(STATE)}</div>
    <div class="choices" id="choiceList"></div>
    <div id="consequenceBox"></div>
  `;
  const list = document.getElementById("choiceList");
  sc.choices.forEach((c, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="tag">[${c.tag}]</span>${c.label}`;
    btn.onclick = () => chooseOption(sc, c, idx);
    list.appendChild(btn);
  });
}

function evaluateAfterChoice(){
  STATE.forcedEnding = checkZeroEnding();
  STATE.pendingBonus = STATE.forcedEnding ? null : checkBonusTrigger();
}

function nextButtonLabel(){
  if(STATE.forcedEnding) return "SEE WHAT HAPPENS";
  if(STATE.pendingBonus) return "ONE MORE THING";
  return "NEXT WEEK";
}

function advanceAfterChoice(){
  if(STATE.forcedEnding){
    renderEnding();
  } else if(STATE.pendingBonus){
    renderBonusScenario();
  } else {
    STATE.week += 1;
    renderScenario();
  }
}

function chooseOption(sc, choice){
  applyEffects(choice.effects);
  STATE.log.push({week: STATE.week+1, title: sc.title, choice: choice.label});
  evaluateAfterChoice();

  document.getElementById("choiceList").innerHTML = "";
  document.getElementById("consequenceBox").innerHTML = `
    ${renderGauges()}
    <div class="consequence">${choice.result}</div>
    <button class="continue-btn" id="nextBtn">${nextButtonLabel()} &rarr;</button>
  `;
  document.getElementById("nextBtn").onclick = advanceAfterChoice;
}

function renderBonusScenario(){
  const sc = STATE.pendingBonus;
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead("A MATTER OUTSIDE THE AGENDA")}
    ${renderGauges()}
    <div class="scene-title">${sc.title}</div>
    <div class="scene-text">${sc.text(STATE)}</div>
    <div class="choices" id="choiceList"></div>
    <div id="consequenceBox"></div>
  `;
  const list = document.getElementById("choiceList");
  sc.choices.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="tag">[${c.tag}]</span>${c.label}`;
    btn.onclick = () => chooseBonusOption(sc, c);
    list.appendChild(btn);
  });
}

function chooseBonusOption(sc, choice){
  applyEffects(choice.effects);
  STATE.log.push({week: STATE.week+1, title: "[Bonus] " + sc.title, choice: choice.label});
  STATE.pendingBonus = null;
  evaluateAfterChoice();

  document.getElementById("choiceList").innerHTML = "";
  document.getElementById("consequenceBox").innerHTML = `
    ${renderGauges()}
    <div class="consequence">${choice.result}</div>
    <button class="continue-btn" id="nextBtn">${nextButtonLabel()} &rarr;</button>
  `;
  document.getElementById("nextBtn").onclick = advanceAfterChoice;
}

function renderEnding(){
  const ending = STATE.forcedEnding || computeEnding();
  const s = STATE.stats;
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead(STATE.forcedEnding ? `TERM ENDED &mdash; WEEK ${STATE.week + 1}` : "END OF TERM")}
    <div class="end-title">${ending.title}</div>
    <div class="scene-text">${ending.text}</div>
    <div class="end-stats">
      FINAL FIGURES &mdash; ${STAT_LABELS.pc}: ${s.pc} &middot; ${STAT_LABELS.bud}: ${s.bud} &middot; ${STAT_LABELS.mor}: ${s.mor} &middot; ${STAT_LABELS.dean}: ${s.dean}
    </div>
    <button class="continue-btn" id="restartBtn">BEGIN A NEW TERM &rarr;</button>
  `;
  document.getElementById("restartBtn").onclick = () => {
    STATE.stats = { pc:50, bud:50, mor:50, dean:50 };
    STATE.log = [];
    STATE.scenarios = [];
    STATE.forcedEnding = null;
    STATE.pendingBonus = null;
    STATE.bonusFired = { pc:false, bud:false, mor:false, dean:false };
    renderStart();
  };
}

renderStart();
</script>
</body>
</html>
