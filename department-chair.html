<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Office of the Chair</title>
<style>
  :root{
    --paper: #e9e1cb;
    --paper-dark: #ded4b8;
    --ink: #2a2620;
    --navy: #22314a;
    --oxblood: #7a2e2e;
    --manila: #c9a66b;
    --line: #b8ab84;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--paper-dark);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  .desk{
    max-width: 720px;
    margin: 28px auto 60px;
    padding: 0 16px;
  }
  .memo{
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(0,0,0,0.18);
    padding: 28px 32px 24px;
    position: relative;
  }
  .memo::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:6px;
    background: var(--navy);
  }
  .letterhead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 10px; margin-bottom: 18px;
  }
  .letterhead h1{
    font-size: 20px; margin:0; letter-spacing:0.3px; color: var(--navy); font-weight:700;
  }
  .letterhead .sub{
    font-size: 12.5px; color:#5a5340; font-style: italic;
  }
  .letterhead .stamp{
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 11px; text-align:right; color:#5a5340; line-height:1.5;
    white-space:nowrap;
  }
  .gauges{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px 22px;
    margin-bottom: 20px;
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 12px;
  }
  .gauge-row{ }
  .gauge-label{
    display:flex; justify-content:space-between; margin-bottom:3px; color:#463f2f;
  }
  .gauge-track{
    height: 9px; background: #d8cba7; border:1px solid var(--line); position:relative;
  }
  .gauge-fill{
    height:100%; background: var(--navy);
  }
  .gauge-fill.low{ background: var(--oxblood); }
  .gauge-fill.mid{ background: var(--manila); }
  .week{
    font-family:'Courier New',monospace; font-size:12px; color:#5a5340;
    text-align:right; margin-bottom:6px;
  }
  .scene-title{
    font-size: 17px; font-weight:700; margin: 0 0 8px; color: var(--oxblood);
  }
  .scene-text{
    font-size: 15.5px; line-height:1.55; margin-bottom: 18px;
  }
  .choices{
    display:flex; flex-direction:column; gap:8px;
  }
  .choice-btn{
    text-align:left;
    background: var(--paper);
    border:1px solid var(--navy);
    padding: 10px 14px;
    font-family: Georgia, serif;
    font-size: 14.5px;
    color: var(--ink);
    cursor:pointer;
    transition: background 0.12s, transform 0.05s;
  }
  .choice-btn .tag{
    font-family:'Courier New',monospace; font-size:11px; color: var(--oxblood); margin-right:8px;
  }
  .choice-btn:hover{
    background: var(--manila);
  }
  .choice-btn:active{ transform: translateY(1px); }
  .consequence{
    font-family:'Courier New',monospace;
    font-size:12px;
    color: var(--navy);
    margin-top:14px;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    white-space:pre-line;
  }
  .continue-btn{
    margin-top:16px;
    display:inline-block;
    background: var(--navy);
    color: var(--paper);
    border:none;
    padding: 9px 18px;
    font-family:'Courier New',monospace;
    font-size:12.5px;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .continue-btn:hover{ background:#2c4060; }
  .lowfreq-btn{
    margin-top:14px;
    display:block;
    width:100%;
    background: transparent;
    color: var(--oxblood);
    border:1px dashed var(--oxblood);
    padding: 8px 14px;
    font-family:'Courier New',monospace;
    font-size:11.5px;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  .lowfreq-btn:hover{ background: rgba(122,46,46,0.08); }
  .start-screen h1{
    font-size: 24px; color: var(--navy); margin-bottom:4px;
  }
  .start-screen p{
    font-size:15px; line-height:1.6;
  }
  .field-row{
    display:flex; flex-direction:column; gap:4px; margin: 14px 0;
  }
  .field-row label{
    font-family:'Courier New',monospace; font-size:11.5px; color:#5a5340;
  }
  .field-row input{
    font-family: Georgia, serif;
    font-size:15px;
    padding:7px 9px;
    border:1px solid var(--navy);
    background:#fdfaf0;
  }
  .end-title{
    font-size:21px; color:var(--oxblood); margin-bottom:6px;
  }
  .end-stats{
    font-family:'Courier New',monospace; font-size:12px; color:#463f2f;
    margin: 14px 0; line-height:1.7;
  }
  .footer-note{
    text-align:center; font-family:'Courier New',monospace; font-size:11px;
    color:#7a715a; margin-top:14px;
  }
</style>
</head>
<body>
<div class="desk">
  <div class="memo" id="memo"></div>
  <div class="footer-note">OFFICE OF THE CHAIR &middot; INTERNAL CORRESPONDENCE &middot; RETAIN FOR YOUR FILES</div>
</div>

<script>
const STATE = {
  chairName: "",
  deptName: "",
  week: 0,
  totalWeeks: 10,
  stats: { pc: 50, bud: 50, mor: 50, dean: 50 },
  log: [],
  scenarios: [],
  forcedEnding: null,
  pendingBonus: null,
  bonusFired: { pc:false, bud:false, mor:false, dean:false },
  continuation: "advanceWeek",
  usedLowFreq: [],
  pendingLowFreq: null
};

function clamp(n){ return Math.max(0, Math.min(100, n)); }

function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function applyEffects(effects){
  for(const k in effects){ STATE.stats[k] = clamp(STATE.stats[k] + effects[k]); }
}

const STAT_LABELS = {
  pc: "Political Capital",
  bud: "Budget Health",
  mor: "Faculty Morale",
  dean: "Dean's Confidence"
};

// ---------------- SCENARIO DATA ----------------
const SCENARIOS = [
{
  title: "Orientation Memo",
  text: (S) => `Your appointment letter is barely dry. The outgoing chair left you three things: a filing cabinet with no working key, a department budget spreadsheet last updated two years ago, and a sticky note reading "good luck, you'll need it." Your first task is to submit a "Chair's Priorities" memo to the Dean's office by Friday.`,
  choices: [
    { label:"Propose an ambitious agenda: new hires, curriculum overhaul, a speaker series.", tag:"A",
      effects:{pc:5, dean:8, bud:-6, mor:2},
      result:"The Dean is pleased to see initiative. Faculty are wary of promises they've heard before." },
    { label:"Submit a modest, low-risk memo focused on 'stability and continuity.'", tag:"B",
      effects:{pc:2, dean:2, bud:2, mor:6},
      result:"Faculty appreciate that you're not lurching toward change. The Dean's office barely notices you." },
    { label:"Quietly ask three senior faculty what they actually want before writing anything.", tag:"C",
      effects:{pc:8, mor:8, dean:-2},
      result:"Faculty are flattered to be consulted. The Dean's office grumbles about the delay." },
    { label:"Put the memo aside and track down a locksmith for that filing cabinet first.", tag:"D",
      effects:{dean:-6, pc:-3},
      result:"The locksmith never picks up the phone. You waste two mornings walking the block trying to find the shop's actual address, only to discover it's been closed indefinitely over a health and safety violation. The memo goes in late, and the cabinet stays locked." }
  ]
},
{
  title: "The Curriculum Committee Divides",
  text: (S) => `Your curriculum committee has split into two camps: one wants to fold a popular but under-enrolled seminar into a new interdisciplinary gateway course, the other insists this "waters down the major." Both factions have cornered you separately this week, and the vote is Thursday.`,
  choices: [
    { label:"Back the interdisciplinary redesign — it plays well with enrollment metrics upstairs.", tag:"A",
      effects:{dean:10, mor:-8, pc:-3},
      result:"The Dean's office notes your responsiveness to enrollment data. The traditionalist faction feels betrayed." },
    { label:"Defend the existing major and let the seminar survive on its reputation.", tag:"B",
      effects:{mor:9, dean:-7, pc:2},
      result:"Faculty feel you have their back. The Dean's office quietly flags the department as 'resistant to change.'" },
    { label:"Broker a compromise: pilot the gateway course for two years, review the data together.", tag:"C",
      effects:{pc:6, mor:3, dean:3, bud:-3},
      result:"Nobody is thrilled, but nobody walks out of the meeting either. You've bought time — and spent a favor doing it." },
    { label:"Take an urgent call from the Provost about an unrelated crisis instead of sitting in on the vote.", tag:"D",
      effects:{pc:-3, dean:-2, mor:-4},
      result:"By the time you're off the phone, the vote is moot: the committee chair rejected both proposals outright over formatting issues with the submitted documents. Nothing is decided, and both factions quietly blame you for not being in the room." }
  ]
},
{
  title: "A Contested Tenure Case",
  text: (S) => `Dr. Alvarez's tenure case has split the department's external letters: two glowing, one lukewarm, one openly hostile — written, you suspect, by someone still nursing a decade-old grudge over a shared lab space. The vote is close, and everyone is watching how you frame the discussion.`,
  choices: [
    { label:"Convene the committee and let the vote happen on the record, without steering it.", tag:"A",
      effects:{pc:4, mor:2, dean:1},
      result:"You avoid the appearance of thumb-on-the-scale. The vote passes narrowly, and the losing faction remembers your neutrality — for better or worse." },
    { label:"Privately advocate for Alvarez, citing the weak letter's obvious bias.", tag:"B",
      effects:{mor:9, pc:-4, dean:-3},
      result:"Alvarez's supporters are grateful. A colleague files a quiet complaint that you 'influenced the process.'" },
    { label:"Ask the Dean's office to order a fifth, independent external letter before the vote.", tag:"C",
      effects:{dean:5, bud:-4, mor:-2},
      result:"The delay irritates everyone equally, which — in a strange way — is its own kind of fairness." },
    { label:"Since Alvarez's subfield is well outside your own, hold forth instead on the general vagaries and biases of external review.", tag:"D",
      effects:{pc:-3, mor:-3},
      result:"Half the room nods along, relieved someone finally said it out loud. The other half hears a veiled shot at their own scholarship and bristles — you've managed to insult exactly the faculty you weren't talking about." }
  ]
},
{
  title: "The Enrollment Numbers Land",
  text: (S) => `The registrar's report is in: majors are down 14% over three years, mostly first-generation and transfer students choosing "more practical" programs. The Dean's office wants a memo explaining "your plan to reverse this trend" before the budget meeting.`,
  choices: [
    { label:"Propose cutting two low-enrolled electives to fund a new applied-skills course.", tag:"A",
      effects:{dean:9, bud:6, mor:-9},
      result:"The Dean is satisfied you're taking enrollment seriously. Two faculty whose courses were cut stop returning your emails." },
    { label:"Argue the numbers reflect a system-wide trend, not a departmental failure.", tag:"B",
      effects:{dean:-6, mor:5, pc:-2},
      result:"Faculty appreciate you not scapegoating them. The Dean's office notes you 'pushed back on accountability.'" },
    { label:"Launch a joint recruitment push with career services, promising results next year.", tag:"C",
      effects:{bud:-5, pc:5, dean:3, mor:3},
      result:"It costs money you don't fully have, but it buys goodwill on both sides while you wait to see if it works." },
    { label:"Ask an AI tool to draft the memo overnight and send it in without time to review it closely.", tag:"D",
      effects:{dean:-7, pc:-5},
      result:"The memo reads impressively right up until someone in the Dean's office notices it cites a retention study that doesn't exist and recommends launching a 'micro-credential in synergy studies' your department has never taught. It gets forwarded around as a cautionary tale before you even hear about it." }
  ]
},
{
  title: "A Grievance Over Overload",
  text: (S) => `Three adjunct instructors, backed by the union, have filed a grievance: they were assigned a fourth course this semester without the contractually required advance notice or compensation bump. The Associate Dean wants your account of what happened by end of day.`,
  choices: [
    { label:"Acknowledge the error immediately and adjust their pay retroactively.", tag:"A",
      effects:{bud:-6, mor:8, dean:-3},
      result:"The adjuncts are relieved. The Dean's office is irritated by the unplanned expense and the precedent." },
    { label:"Argue the assignments were 'informally agreed to' over email and contest the grievance.", tag:"B",
      effects:{dean:4, mor:-11, bud:2},
      result:"You win a procedural point. Word spreads fast that the chair 'fights its own adjuncts.'" },
    { label:"Escalate to HR and ask for a joint review of how overloads get assigned department-wide.", tag:"C",
      effects:{pc:5, mor:4, dean:-2},
      result:"It's slower and more bureaucratic, but it fixes the actual process instead of just this instance." }
  ]
},
{
  title: "The Viability Review Letter",
  text: (S) => `A letter arrives from the Provost's office: your department has been flagged for a "program viability review" alongside two others, citing cost-per-credit-hour. You have three weeks to prepare a response before a committee — mostly administrators from outside your discipline — makes a recommendation.`,
  choices: [
    { label:"Mobilize faculty governance allies to publicly question the review's methodology.", tag:"A",
      effects:{pc:7, dean:-9, mor:6},
      result:"The senate raises real concerns about the metrics used. The Provost's office does not appreciate being challenged in public." },
    { label:"Prepare a data-heavy, cooperative response emphasizing efficiency improvements you'll make.", tag:"B",
      effects:{dean:8, bud:2, mor:-4},
      result:"The review committee appreciates the tone. Some faculty feel you 'negotiated with the people trying to close us.'" },
    { label:"Quietly reach out to alumni and local employers for letters of support before the hearing.", tag:"C",
      effects:{pc:4, dean:4, bud:1},
      result:"External validation lands well with the committee, and costs you almost nothing politically." },
    { label:"Blame the administration's opaque budget data for making real viability planning impossible, and rally the other flagged chairs to make the case together.", tag:"D",
      effects:{pc:8, mor:4, dean:-8},
      result:"The other two flagged chairs turn out to have been quietly furious about the same missing cost data for years, and a joint letter reaches the Provost within the week — this is bigger than any one department now. The review committee doesn't appreciate being told the numbers themselves are the problem, and the Provost's office quietly marks all three of you as 'coordinating against the process.'" }
  ]
},
{
  title: "A Call From the State House",
  text: (S) => `A state legislator's staffer calls, then emails, asking pointed questions about a course reading list that "constituents have raised concerns about." Local news has picked up the story. Your Dean forwards the email with one line: "Handle this carefully."`,
  choices: [
    { label:"Publicly defend the instructor's academic freedom and the course as designed.", tag:"A",
      effects:{mor:10, dean:-8, pc:-3},
      result:"Faculty rally behind you. The Dean's office is now fielding calls you didn't expect to generate." },
    { label:"Quietly ask the instructor to add 'alternative perspective' readings to defuse the story.", tag:"B",
      effects:{dean:6, mor:-10, pc:2},
      result:"The story dies down within a week. The instructor never quite trusts your judgment again." },
    { label:"Refer all inquiries to the university's general counsel and legal/media office.", tag:"C",
      effects:{pc:3, dean:3, mor:1},
      result:"It's the boring answer, but it keeps you out of the crossfire almost entirely." },
    { label:"Treat it as free publicity and post enthusiastically about the course on LinkedIn.", tag:"D",
      effects:{pc:4, mor:6, dean:-12},
      result:"Your post — 'Proud of our faculty for teaching without fear!' — collects thousands of likes within a day, half from supportive alumni and half from constituents tagging the legislator's office directly in the comments. The story is now trending statewide, and the Dean's office is fielding calls from people who'd never heard of your department yesterday." }
  ]
},
{
  title: "One Retirement, One Fight",
  text: (S) => `Professor Kowalski's retirement opens a rare tenure-line hire. Your senior faculty member wants a replacement in her subfield to keep the concentration alive; two junior faculty argue the department desperately needs someone with strong digital skills to stay "relevant" to enrollment. The Dean will only approve one line.`,
  choices: [
    { label:"Back the traditional subfield hire — protect what's historically strong.", tag:"A",
      effects:{mor:5, dean:-4, bud:0},
      result:"Senior faculty are relieved their field survives. The junior faculty feel the department is choosing the past over the future." },
    { label:"Back the hire with strong digital skills, citing enrollment and grant potential.", tag:"B",
      effects:{dean:8, mor:-6, pc:1},
      result:"The Dean's office loves the pitch. It will take years to know if the bet pays off — and someone's field just quietly ended." },
    { label:"Ask the Dean for a compromise: a joint appointment split across two departments.", tag:"C",
      effects:{pc:6, dean:2, mor:2, bud:-2},
      result:"It's an unusual ask, but it lets you avoid picking a side outright — for now." }
  ]
},
{
  title: "Governance Fatigue in August",
  text: (S) => `A new university-wide assessment mandate lands in your inbox in mid-August, with a comment period that closes before the semester even starts. Almost no one on the senate's curriculum subcommittee is reachable. You suspect this timing is not an accident.`,
  choices: [
    { label:"Flag the timing publicly to senate leadership and request an extension.", tag:"A",
      effects:{pc:6, dean:-5, mor:4},
      result:"The extension is granted, grudgingly. Someone in the Provost's office now considers you 'a process person.'" },
    { label:"Quietly comply and draft the department's response yourself over the weekend.", tag:"B",
      effects:{dean:5, mor:-3, pc:-2},
      result:"It's done on time, and nobody but you knows what it cost you personally." },
    { label:"Ignore the deadline; let the mandate default to a generic boilerplate response.", tag:"C",
      effects:{dean:-6, pc:-2, mor:1},
      result:"It's the path of least effort — and the Dean's office notices departments that treat mandates as optional." },
    { label:"Hand the whole response off to your deputy chair to draft.", tag:"D",
      effects:{mor:-7, pc:-2, dean:-3},
      result:"Your deputy spends two solid weekends building a meticulous response — then the university revises the mandate's requirements with four days' notice, rendering most of it moot. They are not shy about letting you know exactly how they feel about redoing it from scratch." }
  ]
},
{
  title: "The Annual Report",
  text: (S) => `Spring closes with the ritual all chairs dread: the annual report to the Dean, summarizing the year and stating whether you intend to continue in the role. Faculty, staff, and the Dean's office are all quietly forming their own private verdicts on how this year went.`,
  choices: [
    { label:"Write an honest report — successes, failures, and the fights that are still unresolved.", tag:"A",
      effects:{pc:4, dean:2, mor:3},
      result:"It's not the most flattering document you've ever written, but it's the one people trust." },
    { label:"Write a polished, achievement-forward report emphasizing everything that went well.", tag:"B",
      effects:{dean:6, mor:-3},
      result:"The Dean's office likes it. A colleague who lived through this year privately calls it 'creative writing.'" },
    { label:"Ask three faculty to co-sign the report with you, sharing both credit and blame.", tag:"C",
      effects:{mor:7, pc:3, dean:1},
      result:"It's an unusual move, and it lands as a sign that you see this as a shared project, not just your résumé." },
    { label:"Use the report to catalogue, in detail, everywhere the administration failed the department this year.", tag:"D",
      effects:{mor:8, pc:5, dean:-9},
      result:"The report is thorough, sharply argued, and reads less like a self-assessment than an indictment. The Dean doesn't push back on the substance — instead, he quietly starts treating you like someone angling for a seat in the administration rather than someone content running a department, and stops sharing things off the record." }
  ]
},
{
  title: "The Cross-Listing Turf War",
  text: (S) => `The Sociology chair wants to cross-list your most popular seminar so it counts toward both departments' enrollment numbers. Your faculty see it as free-riding on a course they built; the Dean's office sees a tidy way to make two departments' numbers look better on paper.`,
  choices: [
    { label:"Agree, but insist your department gets sole credit for the enrollment count.", tag:"A",
      effects:{dean:5, pc:-3, mor:2},
      result:"Sociology's chair is annoyed, but the Dean's office likes that you found a way to say yes." },
    { label:"Refuse outright — the course stays yours, full stop.", tag:"B",
      effects:{mor:6, dean:-5, pc:-2},
      result:"Your faculty feel protected. You've made an enemy in Sociology who now sits on your college's budget subcommittee." },
    { label:"Propose splitting the enrollment credit fifty-fifty going forward.", tag:"C",
      effects:{pc:-3, dean:-4, mor:-6, bud:-3},
      result:"The split looks fine on paper until the registrar's cancellation sweep: Sociology's half of the cross-listing comes in under the minimum, and the whole course gets automatically pulled from the schedule — even though your section alone had more than enough students to run it." }
  ]
},
{
  title: "The AI Plagiarism Case",
  text: (S) => `A professor flags a student's final paper as "obviously AI-generated," but the detection software's report is inconclusive and the student is adamant it's their own work. The student's parent, a lawyer, has already emailed twice.`,
  choices: [
    { label:"Support the faculty member's judgment and uphold the academic integrity charge.", tag:"A",
      effects:{mor:5, dean:-2, pc:-3},
      result:"Faculty feel backed. The parent's emails escalate to the Provost's office, citing 'unreliable software' as evidence." },
    { label:"Ask for a live oral defense of the paper as a fairer alternative to the software report.", tag:"B",
      effects:{pc:6, mor:2, dean:1},
      result:"It's more work, but it settles the question more convincingly than any detector could." },
    { label:"Quietly encourage the professor to let it go given the weak evidence.", tag:"C",
      effects:{mor:-7, dean:3},
      result:"The complaint disappears. So does the professor's trust that you'll back tough calls." }
  ]
},
{
  title: "The Harassment Complaint",
  text: (S) => `A graduate student has filed a complaint with the Title IX office against a senior, well-funded faculty member. You're informed only that "an investigation is underway" and asked not to discuss it — while that same faculty member keeps asking you, directly, what's going on.`,
  choices: [
    { label:"Tell him plainly that you can't discuss an active investigation, full stop.", tag:"A",
      effects:{dean:6, mor:-3, pc:2},
      result:"He's furious at the silence. The Title IX office notes your department handled it correctly." },
    { label:"Quietly reassign his advisees to other faculty 'as a precaution' before any finding.", tag:"B",
      effects:{mor:4, dean:-4, pc:-2},
      result:"Students feel protected. He accuses you of prejudging an unresolved case, and he's not entirely wrong." },
    { label:"Do nothing differently until the investigation formally concludes.", tag:"C",
      effects:{dean:3, mor:-6},
      result:"It's procedurally correct and it makes several students in the program deeply uneasy in the meantime." }
  ]
},
{
  title: "Accreditation Site Visit",
  text: (S) => `The programmatic accreditors arrive in six weeks, and your last self-study binder was assembled by someone who retired in 2019. The visit determines whether your program keeps its accreditation — and whether students can keep qualifying for certain licensure exams.`,
  choices: [
    { label:"Pull two faculty off their normal service duties to rebuild the self-study properly.", tag:"A",
      effects:{dean:7, mor:-5, bud:-2},
      result:"The binder is genuinely strong. The two faculty you conscripted are quietly resentful for the rest of the semester." },
    { label:"Hire a part-time consultant who specializes in accreditation reports.", tag:"B",
      effects:{dean:5, mor:2, pc:-5},
      result:"There's no line item anywhere for this. Rather than let the visit go sideways, you quietly cover the consultant's fee yourself out of a sense of duty nobody asked you to have. The binder is the smoothest you've ever seen — and you're fairly certain a reimbursement request would go nowhere, so you never file one." },
    { label:"Assemble it yourself over several very long nights.", tag:"C",
      effects:{pc:-2, dean:3, mor:3},
      result:"Faculty appreciate that you didn't dump it on them. You are exhausted for a month afterward." }
  ]
},
{
  title: "The Guest Speaker Controversy",
  text: (S) => `A faculty member's invited speaker for the colloquium series has a history of inflammatory public statements. A student group is organizing a protest; a different student group is organizing a counter-letter defending the invitation on academic-freedom grounds.`,
  choices: [
    { label:"Let the talk proceed as scheduled and add a moderated Q&A for pointed questions.", tag:"A",
      effects:{mor:5, dean:-4, pc:2},
      result:"Faculty feel their academic judgment was respected. The Dean's office fields angry calls for a week." },
    { label:"Ask the faculty host to postpone 'for scheduling reasons.'", tag:"B",
      effects:{dean:5, mor:-8, pc:-3},
      result:"The controversy quietly dissolves. The host never quite forgives the transparent excuse." },
    { label:"Add a second, opposing speaker to the same event as a 'balance' measure.", tag:"C",
      effects:{pc:3, dean:1, mor:-2},
      result:"Almost nobody is satisfied by the compromise, which is at least evenly distributed." }
  ]
},
{
  title: "The Open-Textbook Mandate",
  text: (S) => `The Provost's office announces a push toward "zero-cost" open educational resources in gateway courses, citing student debt concerns. Faculty who've spent years refining their syllabi around a specific (non-free) textbook are not pleased about redoing their prep work for free.`,
  choices: [
    { label:"Mandate the switch for all gateway sections next semester.", tag:"A",
      effects:{dean:8, mor:-9, bud:3},
      result:"Students save real money. Faculty spend their summer rebuilding courses they didn't ask to rebuild." },
    { label:"Make it optional and highlight faculty who volunteer to switch as models for others.", tag:"B",
      effects:{mor:5, dean:-3, pc:2},
      result:"Adoption is slow but voluntary, and nobody feels ambushed by the policy." },
    { label:"Request course-release time or a stipend for faculty willing to convert their materials.", tag:"C",
      effects:{bud:-5, mor:6, dean:2},
      result:"It costs money the department barely has, but it turns a mandate into an actual incentive." }
  ]
},
{
  title: "The Sabbatical Gap",
  text: (S) => `Your most popular lecturer's sabbatical was approved before you became chair, and there's no budget line for adjunct replacement teaching. Three required courses now have no instructor of record six weeks before the semester starts.`,
  choices: [
    { label:"Ask two other faculty to each pick up an overload course for extra pay.", tag:"A",
      effects:{bud:-5, mor:-2, dean:2},
      result:"The courses are covered. Two faculty are noticeably more tired for the rest of the term." },
    { label:"Petition the Dean's office for emergency adjunct funding.", tag:"B",
      effects:{dean:-3, bud:-3, pc:3},
      result:"You get partial funding after some negotiation, and a reputation for asking for money at inconvenient times." },
    { label:"Cut one of the three sections and let students take it as an overload next year.", tag:"C",
      effects:{mor:-6, dean:4, bud:2},
      result:"It solves your staffing problem and creates a bottleneck problem for a hundred students instead." },
    { label:"Fill all three vacancies fast with newly available adjuncts, even though a couple of the CVs don't quite add up.", tag:"D",
      effects:{bud:3, dean:2, mor:-3, pc:-2},
      result:"The courses are covered by the first day of add/drop. By week three, one of the new hires can't answer basic questions in their own field, and a colleague quietly discovers their listed 'PhD candidate, ABD' status might be more aspirational than actual. It solves your problem today; you suspect it's going to have a much longer half-life than that." }
  ]
},
{
  title: "The Online Course Push",
  text: (S) => `The Provost's strategic plan calls for expanding online sections to capture "adult learner" tuition revenue. Several senior faculty consider online teaching beneath the discipline; a couple of junior faculty are quietly excited about the extra pay for developing sections.`,
  choices: [
    { label:"Volunteer the junior faculty who are interested and let the rest opt out.", tag:"A",
      effects:{dean:6, mor:3, pc:1},
      result:"It's a clean win — the willing get paid to build something, and nobody is forced into it." },
    { label:"Push back on the plan, arguing your discipline doesn't translate well online.", tag:"B",
      effects:{mor:5, dean:-8, bud:-2},
      result:"Faculty feel defended. The Dean's office quietly redirects the online-development funds to a more cooperative department." },
    { label:"Agree to pilot one large online section taught by you personally, to see how it goes.", tag:"C",
      effects:{dean:4, mor:1, pc:-2},
      result:"You've bought goodwill with the administration at the cost of your own already-thin bandwidth." },
    { label:"Before committing anyone, ask the Provost's office about revenue sharing or IP ownership for the faculty building these sections.", tag:"D",
      effects:{pc:2, dean:-3, mor:-9},
      result:"The answer comes back plainly: course development counts as normal duties, no extra pay, no revenue share — and per policy, the university retains the resulting curriculum outright, free to repackage it into as many continuing-education sections as it likes, taught by whoever it chooses, no original faculty required. The junior faculty who'd been excited about the extra pay stop being excited." }
  ]
},
{
  title: "Office Space Wars",
  text: (S) => `The building renovation plan lands on your desk: three fewer offices than the department currently has, and everyone assumes someone else will be the one who loses a window. A new hire is due to arrive with nowhere obvious to put them.`,
  choices: [
    { label:"Assign offices by seniority, as has always been done informally.", tag:"A",
      effects:{mor:2, dean:2, pc:-1},
      result:"It's the path of least resistance, and it means your new hire gets the smallest interior office in the building." },
    { label:"Propose a lottery among mid-career faculty for the contested offices.", tag:"B",
      effects:{mor:5, pc:3, dean:-1},
      result:"It feels fairer to most people, though the two who lost the lottery aren't fully convinced of that." },
    { label:"Fight the facilities office for one additional office allocation.", tag:"C",
      effects:{dean:-4, pc:4, mor:4},
      result:"You win an unglamorous but real victory that nobody outside the department will ever know to thank you for." },
    { label:"Give up your own faculty office, since you're working out of the chair's office anyway.", tag:"D",
      effects:{mor:8, pc:5, dean:1},
      result:"The new hire gets a real office, the seniority squabbling evaporates overnight, and you quietly move your books into the chair's office shelves. It costs you the one workspace that was ever really yours — some evenings you miss having a door to close that isn't also where people come to complain." }
  ]
},
{
  title: "The Joint-Degree Negotiation",
  text: (S) => `A peer institution's department wants to co-design a joint master's degree, which would raise your program's visibility but requires ceding some curricular control to a partner faculty across state lines, plus a governance structure nobody on your committee has patience for.`,
  choices: [
    { label:"Pursue the joint degree and volunteer to co-chair the design committee yourself.", tag:"A",
      effects:{pc:5, dean:6, mor:-4, bud:-2},
      result:"It's a genuinely good opportunity, purchased almost entirely with your own time and attention." },
    { label:"Decline for now, citing the governance complexity and thin faculty bandwidth.", tag:"B",
      effects:{dean:-5, mor:4},
      result:"Faculty are relieved not to take on more. The Dean's office notes you passed on a visibility opportunity." },
    { label:"Push through every tedious cross-institution detail yourself — financial-aid articulation, accreditation paperwork, the revenue-sharing formula — to lock in a real cut of the joint tuition.", tag:"D",
      effects:{bud:9, mor:-6, pc:-4},
      result:"Six months of committee calls and paperwork later, the revenue-sharing formula is signed and starts padding your budget for real. You're running on fumes by the end of it, and two other things that needed your attention this whole time — a grievance, a curriculum review — piled up untouched while you weren't looking." }
  ]
},
{
  title: "The Colloquium Funding Cut",
  text: (S) => `Central university funding for your visiting-speaker series is cut by 60% with no warning. A student club circulates a petition demanding the series continue at full strength, apparently unaware the money simply isn't there anymore.`,
  choices: [
    { label:"Scale the series down honestly and explain the budget situation publicly.", tag:"A",
      effects:{mor:3, dean:1, pc:2},
      result:"Students are disappointed but understand it wasn't a departmental choice." },
    { label:"Ask faculty to donate honoraria-free time to keep the series at full size.", tag:"B",
      effects:{mor:-6, pc:3, dean:2},
      result:"The series survives on faculty goodwill that is not, in fact, an infinite resource." },
    { label:"Redirect funds from another line item — travel support — to cover the gap.", tag:"C",
      effects:{bud:-3, mor:-5, dean:1},
      result:"The series continues. Faculty who lost travel funding are not thrilled about the trade you made on their behalf." },
    { label:"Move the remaining talks to Zoom and lean on speakers willing to volunteer their time.", tag:"D",
      effects:{bud:5, mor:-3, pc:3, dean:1},
      result:"It costs almost nothing and technically keeps the series alive, but attendance drops off a cliff — a few sessions are just you, the speaker, and three students watching from their dorm rooms. The petition organizers declare victory anyway, since technically the series didn't end." }
  ]
},
{
  title: "The Student Petition",
  text: (S) => `A petition with 80 signatures accuses a veteran faculty member of "unfair and demoralizing" grading practices. The professor insists their standards are simply rigorous, and points out that most complainants are struggling students.`,
  choices: [
    { label:"Review a sample of the graded work yourself before deciding anything.", tag:"A",
      effects:{pc:4, dean:2, mor:1},
      result:"It's extra work, but it means whatever you decide next is actually grounded in evidence." },
    { label:"Back the professor publicly and tell students rigor isn't the same as unfairness.", tag:"B",
      effects:{mor:-6, dean:3, pc:-2},
      result:"The professor is grateful. Word spreads among students that complaints go nowhere in your department." },
    { label:"Quietly suggest the professor consider adjusting the grading rubric going forward.", tag:"C",
      effects:{mor:4, dean:-2, pc:-1},
      result:"Students feel heard. The professor feels like their judgment was overruled without a real conversation." },
    { label:"Fall down a rabbit hole reading pedagogy research on grading practices before deciding anything.", tag:"D",
      effects:{dean:-4, pc:-3, mor:-2},
      result:"Three days and eleven open browser tabs later, you've developed a full-blown existential crisis about whether grades mean anything at all, several strongly-held opinions about 'ungrading,' and no actual answer for the eighty students still waiting to hear back. The petition organizers escalate to the Dean's office out of sheer impatience." }
  ]
},
{
  title: "The Cluster Hire Initiative",
  text: (S) => `The Provost announces a university-wide cluster hire around a trendy interdisciplinary theme and invites departments to submit proposals for a fully Dean's-office-funded line — if you can make a credible case your department belongs in the cluster.`,
  choices: [
    { label:"Submit an ambitious proposal reframing part of your discipline around the cluster theme.", tag:"A",
      effects:{dean:8, pc:3, mor:-3},
      result:"The Dean's office loves the initiative. A few faculty grumble that you're 'chasing trends' with the department's identity." },
    { label:"Sit this one out and wait for a hiring cycle that fits your department's actual needs.", tag:"B",
      effects:{dean:-3, mor:3},
      result:"You avoid an awkward-fit hire, and you also watch a fully-funded line go to a more opportunistic department." },
    { label:"Propose a joint candidate whose research genuinely bridges the cluster and your core discipline.", tag:"C",
      effects:{pc:5, dean:4, mor:2},
      result:"It takes more work to write convincingly, but it's the rare cluster-hire proposal that isn't obviously a stretch." }
  ]
},
{
  title: "Quiet Quitting",
  text: (S) => `You notice it gradually: committee reports arriving late, office hours quietly shortened, service work drying up across the department. Nobody is in open revolt. Everyone is just doing exactly the minimum, and exactly on time to avoid formal consequences.`,
  choices: [
    { label:"Hold one-on-one check-ins with faculty to understand what's actually going on.", tag:"A",
      effects:{mor:6, pc:2, dean:-1},
      result:"You learn more than you expected about burnout, and it takes real time you don't fully have." },
    { label:"Send a firm reminder memo about service expectations and deadlines.", tag:"B",
      effects:{mor:-5, dean:3},
      result:"Reports come in on time again. The underlying exhaustion driving the slowdown goes completely unaddressed." },
    { label:"Quietly redistribute the heaviest service burdens away from the most depleted faculty.", tag:"C",
      effects:{mor:5, pc:-2, bud:0},
      result:"It helps the people who needed it most, and it means a smaller group is now doing more of the department's actual work." },
    { label:"Sternly clamp down on the slowdown with the Dean's explicit backing — formal expectations, documented consequences.", tag:"D",
      effects:{dean:9, mor:-11, pc:-4},
      result:"The Dean's office is thrilled to see a chair finally 'address the culture problem' head-on. Compliance snaps back within a week. So does the goodwill you'd built up over the rest of the year — and two faculty quietly start updating their CVs." }
  ]
},
{
  title: "Your Own Scholarship Stalls",
  text: (S) => `You realize you haven't touched your own research in months. A co-author gently asks, for the second time, when you'll return their edits. Your annual review as a scholar — separate from your review as chair — is coming up.`,
  choices: [
    { label:"Block out a protected half-day each week for your own work, no exceptions.", tag:"A",
      effects:{pc:-3, mor:-2, dean:-1},
      result:"Department business piles up slightly. Your own research inches forward for the first time in months." },
    { label:"Let the research wait; the department's problems won't pause for your CV.", tag:"B",
      effects:{mor:3, dean:2, pc:1},
      result:"The department runs smoothly. Your co-author starts making other plans for the project." },
    { label:"Bring a graduate student on to help move the project forward in smaller increments.", tag:"C",
      effects:{bud:-2, pc:1, mor:1},
      result:"It's a modest fix that keeps the work alive without demanding time you don't have." }
  ]
},
{
  title: "The Committee Assignment Squabble",
  text: (S) => `Nobody wants to serve on the unglamorous but essential assessment committee this year. Two people you ask give elaborate reasons why it should be someone else. The deadline to submit committee rosters to the Dean's office is tomorrow.`,
  choices: [
    { label:"Assign it by fiat to whoever has the lightest service load this year.", tag:"A",
      effects:{mor:-4, dean:3, pc:1},
      result:"The roster gets submitted on time. The assignee is not going to forget you did this to them." },
    { label:"Serve on the committee yourself rather than force the issue.", tag:"B",
      effects:{pc:-2, mor:4, dean:1},
      result:"Faculty appreciate that you didn't dump it on someone else. Your own week gets noticeably fuller." },
    { label:"Offer a small course-release incentive to whoever volunteers first.", tag:"C",
      effects:{bud:-3, mor:3, pc:2},
      result:"Someone volunteers almost immediately. You've just set a precedent people will expect again next year." },
    { label:"Finally assign it to the one faculty member who's dodged committee service for years on a reputation for being terrible at it.", tag:"D",
      effects:{mor:6, dean:-6, pc:-1},
      result:"The rest of the department is quietly delighted somebody finally called the bluff. The committee's actual output, months later, justifies exactly why this person was allowed to dodge service for so long — the assessment report comes back from the Dean's office needing to be substantially rewritten." }
  ]
},
{
  title: "The Exit Interview",
  text: (S) => `Your most productive junior faculty member has accepted an offer elsewhere. In the exit interview, she's candid: the real reasons she's leaving are things you could plausibly have fixed — inequitable service loads, a slow tenure-clock stop request, feeling unheard in meetings.`,
  choices: [
    { label:"Take detailed notes and commit, on the record, to changing the specific practices she named.", tag:"A",
      effects:{mor:5, pc:3, dean:-1},
      result:"It won't get her to stay, but it might keep the next person from leaving for the same reasons." },
    { label:"Thank her for her service and treat the departure as a normal career move.", tag:"B",
      effects:{dean:2, mor:-4},
      result:"It's the easier conversation to have. The colleagues who share her frustrations notice nothing changes." },
    { label:"Accept the resignation, and apologize again for how long her office and lab space took to get set up when she first arrived.", tag:"C",
      effects:{mor:-5, pc:-2, dean:1},
      result:"She pauses, visibly recalibrating what she thought this conversation was going to be about. The space issue was resolved two years ago and wasn't remotely what she just told you was driving her out. She leaves having learned, one more time, exactly what you were and weren't listening to." },
    { label:"Counter-offer aggressively to try to keep her, using discretionary funds you don't really have.", tag:"D",
      effects:{bud:-6, dean:-2, mor:2},
      result:"She stays, for now. You've spent money you'll be explaining to the Dean's office for the rest of the year." }
  ]
},
{
  title: "A Ranking Story Breaks",
  text: (S) => `A higher-ed publication ranks your program's subfield near the bottom of a regional comparison, based on metrics your faculty consider methodologically dubious. The Dean's office forwards the story with the subject line "thoughts?"`,
  choices: [
    { label:"Write a public rebuttal detailing the ranking's methodological flaws.", tag:"A",
      effects:{pc:4, dean:-2, mor:5},
      result:"Faculty feel defended in public. The publication doesn't retract anything, but at least your side is on record." },
    { label:"Respond to the Dean's office privately with context, and say nothing publicly.", tag:"B",
      effects:{dean:4, mor:-3},
      result:"The Dean's office appreciates the discretion. Faculty feel the story was left unanswered." },
    { label:"Use the story internally as a case for a resource request to actually improve the metrics.", tag:"C",
      effects:{dean:3, bud:2, pc:2},
      result:"It's a pragmatic move — turning a bad headline into leverage for something the department actually needed." },
    { label:"Hire a federal work-study student to run a social media push about the program.", tag:"D",
      effects:{bud:-1, pc:2, mor:1, dean:1},
      result:"The posts are earnest, occasionally off-brand, and pull in a modest bump in followers among prospective students. It does approximately nothing to answer the actual methodology complaint, but it's nearly free, and nobody at the Dean's office seems to notice the difference between 'we addressed this' and 'we posted about it.'" }
  ]
},
{
  title: "The Graduate Unionization Drive",
  text: (S) => `Your graduate teaching assistants have begun an organizing drive. University administration has sent chairs a memo on "permissible neutral communication," while several of your own faculty — some sympathetic, some alarmed — are asking you what the department's position is.`,
  choices: [
    { label:"Stick strictly to the administration's neutral talking points in every conversation.", tag:"A",
      effects:{dean:5, mor:-4, pc:-1},
      result:"It's procedurally safe. Several TAs interpret your careful neutrality as quiet opposition." },
    { label:"Privately tell TAs you personally support their right to organize, off the record.", tag:"B",
      effects:{mor:7, dean:-8, pc:-2},
      result:"TAs are grateful. Someone repeats your comment to the Provost's office within the week." },
    { label:"Focus your energy on fixing the specific workload complaints driving the organizing.", tag:"C",
      effects:{mor:5, pc:3, dean:-1},
      result:"It doesn't resolve the larger question, but it addresses the actual grievances underneath it." }
  ]
},
{
  title: "The Named Gift",
  text: (S) => `A wealthy alumnus offers a substantial gift to endow a professorship — on the condition that the position focus on a specific ideological approach to the discipline that much of your faculty finds intellectually thin.`,
  choices: [
    { label:"Accept the gift but negotiate broad, discipline-neutral language into the endowment terms.", tag:"A",
      effects:{bud:8, pc:3, mor:-2},
      result:"The money is real and badly needed. A few faculty remain uneasy about what precedent this sets." },
    { label:"Decline the gift to preserve the department's intellectual independence.", tag:"B",
      effects:{mor:6, dean:-5, bud:0},
      result:"Faculty respect the principle. The Dean's office quietly wonders if you understand how development offices work." },
    { label:"Refer the negotiation entirely to the development office and stay out of the specifics.", tag:"C",
      effects:{dean:3, pc:-2, mor:-1},
      result:"It's the safest option for you personally, and it means the terms get set largely without faculty input." },
    { label:"Spend weeks personally cultivating the donor, hoping to grow the gift into something transformative.", tag:"D",
      effects:{pc:-4, mor:-2, dean:-3},
      result:"You build real rapport over several dinners and campus tours, and the number under discussion climbs well past the original offer — right up until the donor's primary contact in the development office resigns without notice, the paperwork stalls in the reshuffle, and the whole gift quietly evaporates before anyone signs anything." }
  ]
},
{
  title: "The Summer Conference Rental",
  text: (S) => `Facilities offers to rent out your department's newly renovated seminar rooms and labs to a for-profit summer test-prep company for six weeks — real revenue for a budget line that badly needs it. The catch: faculty who count on those same summer weeks for lab prep, workshops, or quiet research time would be locked out of their own building.`,
  choices: [
    { label:"Accept the rental deal for the full six weeks.", tag:"A",
      effects:{bud:9, mor:-8},
      result:"The check clears and pads the department's account nicely. Faculty who counted on summer lab access are, understandably, furious to find their own building temporarily off-limits." },
    { label:"Negotiate a shorter, partial rental that avoids peak faculty research weeks.", tag:"B",
      effects:{bud:4, mor:-2, pc:2},
      result:"It's a smaller payout, and a much smaller complaint file, and both feel like a fair trade." },
    { label:"Decline the rental entirely to protect faculty summer access.", tag:"C",
      effects:{mor:3, bud:-1},
      result:"Faculty are grateful. The department also just turned down real money it could have used." }
  ]
},
{
  title: "The Enrollment Cap Increase",
  text: (S) => `The Dean's office offers additional per-student tuition revenue if you raise enrollment caps on your highest-demand gateway courses by twenty percent next semester — no new hires, same instructors, just more students in the same rooms.`,
  choices: [
    { label:"Raise the caps across the board, as offered.", tag:"A",
      effects:{bud:8, mor:-9},
      result:"The revenue helps immediately. Instructors of the affected courses are now grading, by their own count, nearly a third more essays than they signed up for." },
    { label:"Raise caps only in the one course whose instructor volunteers for it.", tag:"B",
      effects:{bud:3, mor:-1},
      result:"It's a modest version of the deal, and the one instructor who opted in genuinely doesn't mind the extra pay that comes with it." },
    { label:"Turn down the offer and keep caps where they are.", tag:"C",
      effects:{mor:2, dean:-3},
      result:"Faculty workloads stay exactly as promised. The Dean's office notes, not for the first time, that your department left money on the table." }
  ]
},
{
  title: "The Adjunct Section Consolidation",
  text: (S) => `Enrollment data shows three of your adjunct-taught sections are each running under half capacity. Merging them into two larger sections would free up a full adjunct salary line for the budget — but it also means eliminating a job someone is currently depending on, mid-year.`,
  choices: [
    { label:"Consolidate the sections and let the adjunct go at semester's end.", tag:"A",
      effects:{bud:7, mor:-9},
      result:"The math works out cleanly on a spreadsheet. It works out considerably less cleanly for the adjunct who now has to explain a sudden gap in their teaching history." },
    { label:"Consolidate the sections, but personally help the adjunct find another position on campus.", tag:"B",
      effects:{bud:4, mor:-3, pc:2},
      result:"The budget line closes, and the transition, at least, is handled with something like decency." },
    { label:"Leave all three sections running under-enrolled, as-is.", tag:"C",
      effects:{mor:3, bud:-4},
      result:"Nobody loses their job. The department also keeps paying for three sections' worth of instruction that enrollment doesn't really justify." }
  ]
},
{
  title: "The Naming Rights Offer",
  text: (S) => `A regional company wants to put its name on your department's main computer lab — a modest but real annual sponsorship — in exchange for a plaque, a logo on the door, and a mention in departmental materials. A few faculty find the whole idea faintly embarrassing.`,
  choices: [
    { label:"Accept the sponsorship as proposed.", tag:"A",
      effects:{bud:6, mor:-6},
      result:"The check is real and helps the equipment budget considerably. Several faculty now refer to the lab, pointedly, by its old name in every email." },
    { label:"Accept, but negotiate the branding down to something minimal and discreet.", tag:"B",
      effects:{bud:3, mor:-2},
      result:"It's a smaller, quieter version of the deal, and faculty seem willing to live with a small plaque nobody really notices." },
    { label:"Turn the sponsorship down entirely.", tag:"C",
      effects:{mor:2, bud:-1},
      result:"The lab keeps its name and its old equipment a little longer than it probably should have." }
  ]
},
{
  title: "The Faculty Parking Reallocation",
  text: (S) => `Facilities proposes converting half of the faculty parking lot into paid visitor parking, generating steady revenue that would be partially shared with departments willing to give up the spaces — meaning your own faculty would lose their reserved spots.`,
  choices: [
    { label:"Volunteer your department's faculty spots for the program.", tag:"A",
      effects:{bud:5, mor:-7},
      result:"The revenue-share starts landing in your budget within the month. Faculty who now circle the block looking for parking do not consider this a fair trade." },
    { label:"Offer up only half your allotted spots as a compromise.", tag:"B",
      effects:{bud:2, mor:-3},
      result:"It's a partial hit either way, softened slightly by being shared instead of absolute." },
    { label:"Decline to participate and keep the faculty lot as-is.", tag:"C",
      effects:{mor:3, dean:-2},
      result:"Faculty keep their parking. The Dean's office notes your department was the only one that said no to free money." }
  ]
}
];

// ---------------- BONUS SCENARIOS ----------------

    {
      title: "Called In to Collect",

        { label:"Cash in the goodwill: call in a favor of your own from someone equally indebted.", tag:"A",

        { label:"Decline everyone, calmly, and go back to running your own department.", tag:"C",

          result:"A little bit of your standing evaporates from sheer disuse, but your afternoon is, for once, entirely your own." }

    {
      title: "The Backchannel",

        { label:"Use the early information to get ahead of a coming policy change before anyone else does.", tag:"A",
          effects:{pc:-6, dean:6, bud:2},

        { label:"Pass a useful piece of the information along to a struggling colleague's department.", tag:"C",

        { label:"Accept enthusiastically and dive into the extra committee work.", tag:"A",
          effects:{pc:4, dean:5, mor:-5},

        { label:"Accept, but quietly send your associate chair in your place most weeks.", tag:"B",
          effects:{pc:2, dean:2, mor:2},
          result:"Nobody at the task force seems to mind, and your associate chair gets university-level face time they wouldn't have had otherwise." },
        { label:"Decline, citing departmental workload, and suggest another chair instead.", tag:"C",
          effects:{pc:-3, mor:3},
          result:"The department appreciates that you didn't take on more without asking them first. The Provost's office quietly notes the pass." }
      ]
    }
  ],

function checkBonusTrigger(){
  for(const k of ["pc","bud","mor","dean"]){
    if(STATE.stats[k] > 75 && !STATE.bonusFired[k]){
      STATE.bonusFired[k] = true;
      const pool = BONUS_SCENARIOS[k];
      return pool[Math.floor(Math.random() * pool.length)];
    }
  }
  return null;
}

      result:"You've now effectively let a fire alarm dictate your department's calendar for the semester." },
    { label:"Ask facilities, pointedly, whether these are actually related.", tag:"B", effects:{pc:1},
      result:"You get a very long pause, and then a very short 'no comment.'" },
    { label:"Hold the meeting anyway, outside, on the lawn, during the drill.", tag:"C", effects:{mor:4},
      result:"It's, unexpectedly, one of the best department meetings of the year — nobody checks their email once." }
  ]
},
{
  title: "The Directory Listing",
  text: (S) => `The university directory lists your position as vacant, your extension as disconnected, and your office as "currently used for storage" — despite your continued, uninterrupted, physical presence in it every single day.`,
  choices: [
    { label:"Get IT to correct the listing, formally.", tag:"A", effects:{dean:1},
      result:"It's fixed within the week, replaced by a listing that is, this time, at least accurate." },
    { label:"Leave it and enjoy being functionally invisible to campus-wide mass emails.", tag:"B", effects:{mor:2},
      result:"You discover, with some delight, that being listed as 'vacant' means you're excluded from at least four mandatory distribution lists." },
    { label:"Print out the incorrect listing and frame it in your office as a joke.", tag:"C", effects:{mor:2, pc:1},
      result:"It becomes a genuinely good icebreaker for every visitor who sees it and asks if you're haunting your own office." }
  ]
}
];

// ---------------- ENDINGS ----------------
const ZERO_ENDINGS = {
  dean: {
    title: "Terminated With Cause",
    text: `The Provost's office moves faster than anyone expected. By Friday afternoon, campus security has already re-keyed your office door — the one that still doesn't fit the old filing cabinet. There is no exit interview, barely an email. Someone else will be Chair by Monday, and the memos will simply resume as if you were never the one writing them.`
  },
  bud: {
    title: "The Books Don't Close",
    text: `The department's accounts run so far into the red that the Provost's office stops asking about spending priorities and starts asking about receivership. An external financial monitor is assigned to co-sign every purchase order from here on. You are still, technically, the Chair. You are also, as of this week, no longer the one actually running the department.`
  },
  mor: {
    title: "The Department Revolts",
    text: `It doesn't happen all at once, and then it does: three faculty file formal no-confidence complaints in the same week, two more stop attending meetings altogether, and a fourth is quietly interviewing elsewhere. The Dean's office intervenes directly — not to save your chairship, but to keep the department from coming apart around it.`
  },
  pc: {
    title: "Persona Non Grata",
    text: `It's a strange kind of ending — nothing dramatic happens, exactly. Meetings you used to be invited to happen without you. Emails you used to be copied on go out without your name in the header. You are still Chair on paper. In every room that actually matters, you've already been quietly replaced by the org chart itself.`
  }
};

function checkZeroEnding(){
  for(const k of ["dean","bud","mor","pc"]){
    if(STATE.stats[k] <= 0) return ZERO_ENDINGS[k];
  }
  return null;
}

function computeEnding(){
  const s = STATE.stats;
  const avg = (s.pc + s.bud + s.mor + s.dean) / 4;

  if(s.dean < 25){
    return {
      title: "Not Renewed",
      text: `The Dean's office thanks you for your service and informs you, with practiced regret, that the department will "benefit from new leadership" next year. Your former colleagues throw you a small, slightly awkward reception. You did not lose control of the department — you lost the confidence of the people who fund it, one memo at a time.`
    };
  }
  if(s.mor < 25){
    return {
      title: "Vote of No Confidence",
      text: `At the final department meeting of the year, a motion is raised — and passes — expressing no confidence in your chairship. It isn't personal, several colleagues insist afterward, unconvincingly. You governed the department. You never quite led it.`
    };
  }
  if(s.bud < 25){
    return {
      title: "Absorbed",
      text: `The Provost's office announces your department will be "consolidated" into a new School of Interdisciplinary Studies effective next fall. Your faculty keep their jobs. Your letterhead does not survive the transition.`
    };
  }
  if(avg >= 70){
    return {
      title: "The Dean's Office Calls",
      text: `Late one afternoon, the Dean's chief of staff calls to ask, off the record, whether you'd consider a nomination for Associate Dean. You navigated a genuinely difficult year — factions, finances, and a legislature with opinions — and somehow most people still return your calls. Whether that's a promotion or a punishment, you'll find out next year.`
    };
  }
  if(avg >= 50){
    return {
      title: "You Return in the Fall",
      text: `The year ends the way most chair years do: unresolved in a dozen small ways, survivable in the ways that count. Nobody throws you a parade. Nobody calls for your resignation. You'll be back at your desk in August, filing cabinet key still missing, for another year of the same negotiation.`
    };
  }
  return {
    title: "Running on Fumes",
    text: `You finish the year technically intact — still chair, department still open, no formal votes against you — but everyone involved, including you, knows it was closer than the official record will ever show. You start making a list, quietly, of everything you'd do differently.`
  };
}

// ---------------- RENDERING ----------------
function gaugeClass(v){
  if(v < 30) return "low";
  if(v < 60) return "mid";
  return "";
}

function renderGauges(){
  let html = `<div class="gauges">`;
  for(const k of ["pc","bud","mor","dean"]){
    const v = STATE.stats[k];
    html += `
      <div class="gauge-row">
        <div class="gauge-label"><span>${STAT_LABELS[k]}</span><span>${v}</span></div>
        <div class="gauge-track"><div class="gauge-fill ${gaugeClass(v)}" style="width:${v}%"></div></div>
      </div>`;
  }
  html += `</div>`;
  return html;
}

function renderLetterhead(sub){
  return `
    <div class="letterhead">
      <div>
        <h1>${STATE.deptName || "Department of General Studies"}</h1>
        <div class="sub">Office of the Chair${STATE.chairName ? " &mdash; " + STATE.chairName : ""}</div>
      </div>
      <div class="stamp">${sub}</div>
    </div>`;
}

function renderStart(){
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead("NEW APPOINTMENT")}
    <div class="start-screen">
      <h1>Congratulations. You are now Chair.</h1>
      <p>Ten weeks stand between you and the end of your first year &mdash; budgets, tenure cases,
      a curriculum committee at war with itself, and a Dean's office that speaks almost
      entirely in memos. You will not please everyone. You may not please anyone.</p>
      <p>Fill in your appointment details, or leave them blank and we'll assume the usual.</p>
    </div>
    <div class="field-row">
      <label>YOUR NAME</label>
      <input id="chairNameInput" type="text" placeholder="e.g. Dr. Pat Reyes" maxlength="40">
    </div>
    <div class="field-row">
      <label>DEPARTMENT</label>
      <input id="deptNameInput" type="text" placeholder="e.g. Department of Comparative Literature" maxlength="50">
    </div>
    <button class="continue-btn" id="beginBtn">BEGIN TERM &rarr;</button>
  `;
  document.getElementById("beginBtn").onclick = () => {
    STATE.chairName = document.getElementById("chairNameInput").value.trim();
    STATE.deptName = document.getElementById("deptNameInput").value.trim();
    STATE.week = 0;
    STATE.scenarios = shuffled(SCENARIOS).slice(0, STATE.totalWeeks);
    renderScenario();
  };
}

function renderScenario(){
  if(STATE.week >= STATE.scenarios.length){
    renderEnding();
    return;
  }
  const sc = STATE.scenarios[STATE.week];
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead(`WEEK ${STATE.week + 1} OF ${STATE.scenarios.length}`)}
    ${renderGauges()}
    <div class="scene-title">${sc.title}</div>
    <div class="scene-text">${sc.text(STATE)}</div>
    <div class="choices" id="choiceList"></div>
    <div id="consequenceBox"></div>
    <button class="lowfreq-btn" id="lowFreqBtn">Experience a Low-Frequency Event</button>
  `;
  const list = document.getElementById("choiceList");
  sc.choices.forEach((c, idx) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="tag">[${c.tag}]</span>${c.label}`;
    btn.onclick = () => chooseOption(sc, c, idx);
    list.appendChild(btn);
  });
  document.getElementById("lowFreqBtn").onclick = startLowFreqEvent;
}

function evaluateAfterChoice(){
  STATE.forcedEnding = checkZeroEnding();
  STATE.pendingBonus = STATE.forcedEnding ? null : checkBonusTrigger();
}

function nextButtonLabel(){
  if(STATE.forcedEnding) return "SEE WHAT HAPPENS";
  if(STATE.pendingBonus) return "ONE MORE THING";
  if(STATE.continuation === "returnToWeek") return "BACK TO THE WEEK";
  return "NEXT WEEK";
}

function advanceAfterChoice(){
  if(STATE.forcedEnding){
    renderEnding();
  } else if(STATE.pendingBonus){
    renderBonusScenario();
  } else if(STATE.continuation === "returnToWeek"){
    STATE.continuation = "advanceWeek";
    renderScenario();
  } else {
    STATE.week += 1;
    renderScenario();
  }
}

function renderConsequence(result){
  document.getElementById("choiceList").innerHTML = "";
  document.getElementById("consequenceBox").innerHTML = `
    ${renderGauges()}
    <div class="consequence">${result}</div>
    <button class="continue-btn" id="nextBtn">${nextButtonLabel()} &rarr;</button>
  `;
  document.getElementById("nextBtn").onclick = advanceAfterChoice;
}

function chooseOption(sc, choice){
  STATE.continuation = "advanceWeek";
  applyEffects(choice.effects);
  STATE.log.push({week: STATE.week+1, title: sc.title, choice: choice.label});
  evaluateAfterChoice();
  renderConsequence(choice.result);
}

function renderBonusScenario(){
  const sc = STATE.pendingBonus;
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead("A MATTER OUTSIDE THE AGENDA")}
    ${renderGauges()}
    <div class="scene-title">${sc.title}</div>
    <div class="scene-text">${sc.text(STATE)}</div>
    <div class="choices" id="choiceList"></div>
    <div id="consequenceBox"></div>
  `;
  const list = document.getElementById("choiceList");
  sc.choices.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="tag">[${c.tag}]</span>${c.label}`;
    btn.onclick = () => chooseBonusOption(sc, c);
    list.appendChild(btn);
  });
}

function chooseBonusOption(sc, choice){
  applyEffects(choice.effects);
  STATE.log.push({week: STATE.week+1, title: "[Bonus] " + sc.title, choice: choice.label});
  STATE.pendingBonus = null;
  evaluateAfterChoice();
  renderConsequence(choice.result);
}

function pickLowFreqEvent(){
  if(STATE.usedLowFreq.length >= LOW_FREQUENCY_EVENTS.length){
    STATE.usedLowFreq = [];
  }
  const available = LOW_FREQUENCY_EVENTS
    .map((_, i) => i)
    .filter(i => !STATE.usedLowFreq.includes(i));
  const idx = available[Math.floor(Math.random() * available.length)];
  STATE.usedLowFreq.push(idx);
  return LOW_FREQUENCY_EVENTS[idx];
}

function startLowFreqEvent(){
  STATE.continuation = "returnToWeek";
  STATE.pendingLowFreq = pickLowFreqEvent();
  renderLowFreqEvent();
}

function renderLowFreqEvent(){
  const ev = STATE.pendingLowFreq;
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead("LOW-FREQUENCY EVENT")}
    ${renderGauges()}
    <div class="scene-title">${ev.title}</div>
    <div class="scene-text">${ev.text(STATE)}</div>
    <div class="choices" id="choiceList"></div>
    <div id="consequenceBox"></div>
  `;
  const list = document.getElementById("choiceList");
  ev.choices.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="tag">[${c.tag}]</span>${c.label}`;
    btn.onclick = () => chooseLowFreqOption(ev, c);
    list.appendChild(btn);
  });
}

function chooseLowFreqOption(ev, choice){
  applyEffects(choice.effects);
  STATE.log.push({week: STATE.week+1, title: "[Low-Frequency] " + ev.title, choice: choice.label});
  STATE.pendingLowFreq = null;
  evaluateAfterChoice();
  renderConsequence(choice.result);
}

function renderEnding(){
  const ending = STATE.forcedEnding || computeEnding();
  const s = STATE.stats;
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead(STATE.forcedEnding ? `TERM ENDED &mdash; WEEK ${STATE.week + 1}` : "END OF TERM")}
    <div class="end-title">${ending.title}</div>
    <div class="scene-text">${ending.text}</div>
    <div class="end-stats">
      FINAL FIGURES &mdash; ${STAT_LABELS.pc}: ${s.pc} &middot; ${STAT_LABELS.bud}: ${s.bud} &middot; ${STAT_LABELS.mor}: ${s.mor} &middot; ${STAT_LABELS.dean}: ${s.dean}
    </div>
    <button class="continue-btn" id="restartBtn">BEGIN A NEW TERM &rarr;</button>
  `;
  document.getElementById("restartBtn").onclick = () => {
    STATE.stats = { pc:50, bud:50, mor:50, dean:50 };
    STATE.log = [];
    STATE.scenarios = [];
    STATE.forcedEnding = null;
    STATE.pendingBonus = null;
    STATE.bonusFired = { pc:false, bud:false, mor:false, dean:false };
    STATE.continuation = "advanceWeek";
    STATE.usedLowFreq = [];
    STATE.pendingLowFreq = null;
    renderStart();
  };
}

renderStart();
</script>
</body>
</html>
