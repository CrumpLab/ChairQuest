  accreditingBody:      { name: "Accrediting Body",            baseCost: 200, ratio: 1,    costResource: "accredStandards", maxOwned: 1, desc: "A one-time capstone. Complete control over your own accreditation &mdash; and it unlocks the Ed-Tech Division." },
  edTechDivision:       { name: "Ed-Tech Division",            baseCost: 150, ratio: 1.30, costResource: "accredStandards", desc: "Packages the whole apparatus into Ed-Tech Contracts, ready to sell. Requires the Accrediting Body." }
};

// Faculty are the expensive, tenure-track hire; Adjuncts are the cheap,
// disposable one. Office Staff sit in between — not many of them are
// actually needed at this scale. Grad Students are cheaper than either.
const IDLE_HIRE_DEFS = {
  faculty:     { baseCost: 85000, ratio: 1.18 },
  adjunct:     { baseCost: 7000,  ratio: 1.08 },
  officeStaff: { baseCost: 50000, ratio: 1.12 },
  gradStudent: { baseCost: 15000, ratio: 1.10 }
};

let IDLE = null;
let idleIntervalStarted = false;

// Dev Mode: a playtesting toggle (top-right corner), independent of any
// save. Forces every rate-transparency note to show regardless of the
// Tier 3 unlock — see showRates in renderIdle(). Never affects actual
// progression gates or resource values.
const DEV_MODE_KEY = "chairquest_dev_mode";
let DEV_MODE = false;
try{ DEV_MODE = localStorage.getItem(DEV_MODE_KEY) === "1"; }catch(e){}

function freshIdleRun(reputation){
  return {
    reputation: reputation || 0,
    semesterStarted: false,
    tuition: 0,
    revenue: STARTING_LUMP_SUM,
    majors: 0,
    seats: 0,
    grants: 0,
    publications: 0,
    endowment: 0,
    prestige: 0,
    pr: 0,
    stateFunding: 0,
    accredStandards: 0,
    edTechContracts: 0,
    faculty: 0,
    teaching: 0,
    research: 0,
    service: 0,
    adjuncts: 0,
    officeStaff: 0,
    gradStudents: 0,
    ta: 0,
    ra: 0,
    morale: 60,
    facultyOffice: 0,
    classroom: 0,
    academicProgram: 0,
    lab: 0,
    researchCenter: 0,
    doctoralProgram: 0,
    developmentOffice: 0,
    library: 0,
    communicationsOffice: 0,
    satelliteCampus: 0,
    governmentRelations: 0,
    systemCampus: 0,
    chancellorOffice: 0,
    accreditationCouncil: 0,
    accreditingBody: 0,
    edTechDivision: 0,
    lifetimeEarned: 0,
    understaffedSince: null,
    collapseNotice: null,
    lastTick: Date.now()
  };
}

function idleCost(base, ratio, owned){
  return Math.ceil(base * Math.pow(ratio, owned));
}

function requiredAdjuncts(){
  return Math.ceil(IDLE.faculty * 0.3);
}

function requiredOfficeStaff(){
  return Math.ceil(IDLE.faculty / 10);
}

function requiredServiceForAssessment(){
  return Math.ceil(IDLE.academicProgram / 2);
}

function idleIsUnderstaffed(){
  return IDLE.adjuncts < requiredAdjuncts()
    || IDLE.officeStaff < requiredOfficeStaff()
    || IDLE.service < requiredServiceForAssessment();
}

function computeReputationGain(lifetimeEarned){
  return Math.floor(Math.sqrt(Math.max(0, lifetimeEarned)) / 10);
}

function saveIdle(){
  try{ localStorage.setItem(IDLE_SAVE_KEY, JSON.stringify(IDLE)); }catch(e){}
}

function loadIdleSaveRaw(){
  try{
    const raw = localStorage.getItem(IDLE_SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function ensureIdleIntervalRunning(){
  if(!idleIntervalStarted){
    idleIntervalStarted = true;
    setInterval(idleLoop, IDLE_TICK_MS);
  }
}

function startIdleGame(){
  const loaded = loadIdleSaveRaw();
  IDLE = loaded || freshIdleRun(0);
  // A save from before the startup-budget phase existed has no semesterStarted
  // field at all — treat it as already-started rather than sending an
  // in-progress department back to setup and re-granting the lump sum.
  if(loaded && IDLE.semesterStarted == null) IDLE.semesterStarted = true;
  IDLE.lastTick = Date.now();
  ensureIdleIntervalRunning();
  renderIdle();
}

// "Not Your First Rodeo" is a testing/replay shortcut on the start screen —
// it always begins a brand-new department (Reputation 0, fresh startup
// budget) and overwrites any in-progress save, rather than resuming
// wherever a previous session left off.
function startFreshIdleGame(){
  IDLE = freshIdleRun(0);
  IDLE.lastTick = Date.now();
  saveIdle();
  ensureIdleIntervalRunning();
  renderIdle();
}

function idleLoop(){
  if(!IDLE) return;
  const now = Date.now();
  if(!IDLE.semesterStarted){
    IDLE.lastTick = now; // no backlog accrues while the chair is still staffing up
    return;
  }
  const dt = Math.min((now - (IDLE.lastTick || now)) / 1000, 2);
  IDLE.lastTick = now;
  idleTick(dt);
  saveIdle();
  renderIdle();
}

// Single source of truth for every production formula in the game. idleTick()
// applies these rates to advance the resources; renderIdle() calls this same
// function to show the player exactly what each unit is worth (unlocked at
// Tier 3 — "all the budgetary mechanics become visible").
function idleRates(){
  const isShort = idleIsUnderstaffed();

  const moraleMult = 0.5 + (IDLE.morale / 100); // 0.5x .. 1.5x
  const repMult = 1 + IDLE.reputation * 0.02;
  const libraryMult = 1 + IDLE.library * 0.05;
  const satelliteMult = 1 + IDLE.satelliteCampus * 0.2;
  const systemCampusMult = 1 + IDLE.systemCampus * 0.25;
  const chancellorMult = IDLE.chancellorOffice >= 1 ? 1.5 : 1;
  const accreditingBodyMult = IDLE.accreditingBody >= 1 ? 2 : 1;
  let mult = moraleMult * repMult * libraryMult * satelliteMult * systemCampusMult * chancellorMult * accreditingBodyMult;
  if(isShort) mult *= 0.5;

  const programMult = 1 + IDLE.academicProgram * 0.1;
  const prMult = 1 + IDLE.pr * 0.01;
  const recruitMult = mult * programMult * prMult;

  // Recruitment builds two population stats together: Majors (the slower,
  // secondary count) and Seats (the FTE that actually pays Tuition). Every
  // unit of recruiting effort produces both, at a fixed ratio.
  const perTeaching = 0.02 * recruitMult;   // Majors/s
  const perAdjunct = 0.012 * recruitMult;
  const perClassroom = 0.024 * recruitMult;
  const perTA = 0.006 * recruitMult;
  const majorsRate = IDLE.teaching * perTeaching + IDLE.adjuncts * perAdjunct + IDLE.classroom * perClassroom + IDLE.ta * perTA;
  const seatsRate = majorsRate * SEATS_PER_MAJOR;

  // Tuition is calculated from currently-enrolled Seats, not from faculty
  // headcount directly — $10/seat/second, derived from $400/credit at 3
  // credits/course over a 120-second "term."
  const tuitionRate = IDLE.seats * TUITION_PER_SEAT_PER_SECOND;

  // Grants: needs Research assignment AND a Lab. Each Research faculty member
  // can only hold so many active grants at once (GRANT_CAP_PER_FACULTY) —
  // the cap is enforced in idleTick, against the stock, not here.
  const perResearchGrants = IDLE.lab > 0 ? 0.05 * (1 + (IDLE.lab - 1) * 0.1) * mult : 0;
  const grantsRate = IDLE.research * perResearchGrants;
  const grantsCap = IDLE.lab > 0 ? IDLE.research * GRANT_CAP_PER_FACULTY : 0;

  // Average size of a single grant: starts at $10k, grows with Publications
  // (track record) and Reputation (name recognition), capped at $15M. This is
  // a display/theoretical rate — idleTick() re-derives it against the actual,
  // capped grants gained each tick so Revenue never counts a grant that was
  // blocked by a faculty member's personal cap.
  const grantValuePubFactor = 1 + IDLE.publications * GRANT_VALUE_PUB_FACTOR;
  const grantValueRepFactor = 1 + IDLE.reputation * GRANT_VALUE_REP_FACTOR;
  const avgGrantValue = Math.min(GRANT_VALUE_CAP, GRANT_VALUE_BASE * grantValuePubFactor * grantValueRepFactor);

  // Indirect costs: the negotiated cut (50%) of grant dollars the university
  // recovers as overhead, which counts toward Revenue alongside Tuition.
  const grantRevenueGrossRate = grantsRate * avgGrantValue;
  const indirectCostRevenueRate = grantRevenueGrossRate * INDIRECT_COST_RATE;

  // Publications: a base rate that only needs Research assignment (faculty
  // publish on their own effort), no Lab required. A Research Center adds a
  // further boost on top once it's built.
  const perResearchPubBase = 0.04 * mult;
  const perResearchPubBoost = IDLE.researchCenter > 0 ? 0.3 * mult : 0;
  const perResearchPub = perResearchPubBase + perResearchPubBoost;
  const perRA = IDLE.researchCenter > 0 ? 0.15 * mult : 0;
  const publicationsRate = IDLE.research * perResearchPub + IDLE.ra * perRA;

  const perDevOffice = 0.05 * mult;
  const endowmentRate = IDLE.developmentOffice * perDevOffice;

  const prestigeRate = (publicationsRate + endowmentRate) * 0.1;

  const perCommOffice = 0.1 * mult;
  const prRate = IDLE.communicationsOffice * perCommOffice;

  const perGovRelations = 0.08 * mult;
  const stateFundingRate = IDLE.governmentRelations * perGovRelations;

  const perAccredCouncil = 0.06 * mult;
  const accredStandardsRate = IDLE.accreditationCouncil * perAccredCouncil;

  const perEdTechDivision = IDLE.accreditingBody >= 1 ? 0.05 * mult : 0;
  const edTechRate = IDLE.edTechDivision * perEdTechDivision;

  const perService = 0.4; // Morale/sec, not affected by mult — it's what mult is built from

  return {
    isShort, mult,
    majorsRate, seatsRate,
    tuitionRate, grantsRate, grantsCap, publicationsRate, endowmentRate, prestigeRate, prRate, stateFundingRate, accredStandardsRate, edTechRate,
    avgGrantValue, grantRevenueGrossRate, indirectCostRevenueRate,
    perTeaching, perAdjunct, perClassroom, perTA,
    perResearchGrants, perResearchPub, perResearchPubBase, perResearchPubBoost, perRA, perDevOffice, perCommOffice, perGovRelations, perAccredCouncil, perEdTechDivision, perService,
    totalRate: tuitionRate + grantsRate + publicationsRate + endowmentRate + prestigeRate + prRate + stateFundingRate + accredStandardsRate + edTechRate
  };
}

function idleTick(dtSeconds){
  const r = idleRates();

  if(r.isShort){
    if(IDLE.understaffedSince == null) IDLE.understaffedSince = Date.now();
  } else {
    IDLE.understaffedSince = null;
  }

  IDLE.majors += r.majorsRate * dtSeconds;
  IDLE.seats += r.seatsRate * dtSeconds;
  IDLE.tuition += r.tuitionRate * dtSeconds;

  // Grants are capped against the current per-faculty ceiling. The cap only
  // ever limits new growth — reassigning Research faculty away later never
  // claws back grants already banked.
  const grantsCeiling = Math.max(r.grantsCap, IDLE.grants);
  const grantsBefore = IDLE.grants;
  IDLE.grants = Math.min(IDLE.grants + r.grantsRate * dtSeconds, grantsCeiling);
  const grantsGainedPerSec = dtSeconds > 0 ? (IDLE.grants - grantsBefore) / dtSeconds : 0;

  // Revenue: real dollars raised. Tuition plus the indirect cost recovery
  // (the negotiated cut, see INDIRECT_COST_RATE) off actual grants won this
  // tick — using grantsGainedPerSec rather than r.grantsRate so a faculty
  // member capped out on grants doesn't keep generating phantom Revenue.
  const grantRevenueGrossPerSec = grantsGainedPerSec * r.avgGrantValue;
  const indirectCostRevenuePerSec = grantRevenueGrossPerSec * INDIRECT_COST_RATE;
  IDLE.revenue += (r.tuitionRate + indirectCostRevenuePerSec) * dtSeconds;

  IDLE.publications += r.publicationsRate * dtSeconds;
  IDLE.endowment += r.endowmentRate * dtSeconds;
  IDLE.prestige += r.prestigeRate * dtSeconds;
  IDLE.pr += r.prRate * dtSeconds;
  IDLE.stateFunding += r.stateFundingRate * dtSeconds;
  IDLE.accredStandards += r.accredStandardsRate * dtSeconds;
  IDLE.edTechContracts += r.edTechRate * dtSeconds;
  IDLE.lifetimeEarned += (r.tuitionRate + grantsGainedPerSec + r.publicationsRate + r.endowmentRate + r.prestigeRate + r.prRate + r.stateFundingRate + r.accredStandardsRate + r.edTechRate) * dtSeconds;

  // Landing a grant or getting a paper out is a real morale boost, on top of
  // whatever Service faculty are doing.
  const moraleProd = IDLE.service * r.perService + grantsGainedPerSec * MORALE_PER_GRANT + r.publicationsRate * MORALE_PER_PUBLICATION;
  IDLE.morale = Math.max(0, Math.min(100, IDLE.morale + (moraleProd - 0.3) * dtSeconds));

  if(r.isShort && IDLE.understaffedSince != null){
    const elapsed = (Date.now() - IDLE.understaffedSince) / 1000;
    if(elapsed >= UNDERSTAFFED_GRACE_SECONDS){
      collapseDepartment();
    }
  }
}

function collapseDepartment(){
  const gained = computeReputationGain(IDLE.lifetimeEarned);
  const rep = IDLE.reputation + gained;
  IDLE = freshIdleRun(rep);
  IDLE.collapseNotice = `The department collapsed under its own understaffing — you're quietly encouraged to "pursue other opportunities." You leave with ${gained} Reputation banked for next time.`;
}

function doPrestige(){
  if(!IDLE.semesterStarted) return;
  const gained = computeReputationGain(IDLE.lifetimeEarned);
  const rep = IDLE.reputation + gained;
  IDLE = freshIdleRun(rep);
  renderIdle();
}

// The true endgame move. Only available once the Accrediting Body is built
// and enough Ed-Tech Contracts have accumulated. Unlike a normal prestige,
// this doesn't start a new department at a new university — it exits the
// idle layer entirely and drops the player back into the original semester
// game, as a new chair, in a new state. A player could loop through the
// whole game more than once this way.
const SELL_STACK_EDTECH_REQUIRED = 100;

function canSellTheStack(){
  return IDLE.accreditingBody >= 1 && IDLE.edTechContracts >= SELL_STACK_EDTECH_REQUIRED;
}

function sellTheStack(){
  if(!canSellTheStack()) return;
  try{ localStorage.removeItem(IDLE_SAVE_KEY); }catch(e){}
  IDLE = null;
  const memo = document.getElementById("memo");
  memo.innerHTML = `
    ${renderLetterhead("THE SALE IS FINAL")}
    <div class="end-title">You Sold the Whole Stack</div>
    <div class="scene-text">A neighboring state, looking to stand up a public university system almost overnight, buys the entire operation &mdash; the campuses, the accrediting body that made it all officially, unquestionably legitimate, the whole ed-tech pipeline built to package and sell it. The wire transfer clears. Somewhere, a new chair is about to open an appointment letter that looks remarkably familiar.</div>
    <button class="continue-btn" id="newStateBtn">START OVER, ELSEWHERE &rarr;</button>
  `;
  document.getElementById("newStateBtn").onclick = () => {
    renderStart();
  };
}

function recruitStudent(){
  if(!IDLE.semesterStarted) return;
  IDLE.seats += 1;
  renderIdle();
}

function beginSemester(){
  if(IDLE.semesterStarted) return;
  IDLE.semesterStarted = true;
  IDLE.lastTick = Date.now();
  IDLE.understaffedSince = null;
  renderIdle();
}

function hireFaculty(){
  const cost = idleCost(IDLE_HIRE_DEFS.faculty.baseCost, IDLE_HIRE_DEFS.faculty.ratio, IDLE.faculty);
  if(IDLE.faculty >= IDLE.facultyOffice || IDLE.revenue < cost) return;
  IDLE.revenue -= cost;
  IDLE.faculty += 1;
  IDLE.teaching += 1;
  renderIdle();
}

function hireAdjunct(){
  const cost = idleCost(IDLE_HIRE_DEFS.adjunct.baseCost, IDLE_HIRE_DEFS.adjunct.ratio, IDLE.adjuncts);
  if(IDLE.revenue < cost) return;
  IDLE.revenue -= cost;
  IDLE.adjuncts += 1;
  renderIdle();
}

function hireOfficeStaff(){
  const cost = idleCost(IDLE_HIRE_DEFS.officeStaff.baseCost, IDLE_HIRE_DEFS.officeStaff.ratio, IDLE.officeStaff);
  if(IDLE.revenue < cost) return;
  IDLE.revenue -= cost;
  IDLE.officeStaff += 1;
  renderIdle();
}

function hireGradStudent(){
  if(IDLE.doctoralProgram < 1) return;
  const cost = idleCost(IDLE_HIRE_DEFS.gradStudent.baseCost, IDLE_HIRE_DEFS.gradStudent.ratio, IDLE.gradStudents);
  if(IDLE.revenue < cost) return;
  IDLE.revenue -= cost;
  IDLE.gradStudents += 1;
  IDLE.ta += 1;
  renderIdle();
}

function reassignFaculty(from, to){
  if(IDLE[from] <= 0) return;
  IDLE[from] -= 1;
  IDLE[to] += 1;
  renderIdle();
}

function buildIdleBuilding(key){
  const def = IDLE_BUILDING_DEFS[key];
  if(def.maxOwned && IDLE[key] >= def.maxOwned) return;
  const resource = def.costResource || "revenue";
  const cost = idleCost(def.baseCost, def.ratio, IDLE[key]);
  if(IDLE[resource] < cost) return;
  IDLE[resource] -= cost;
  IDLE[key] += 1;
  renderIdle();
}

function fmtIdle(n){
  return Math.floor(n).toLocaleString();
}

function idleBuyBtn(id, label, cost, affordable, extraDisabled, resourceLabel){
  const disabled = (!affordable || extraDisabled) ? "disabled" : "";
  return `<button class="idle-buy-btn" id="${id}" ${disabled}>${label}<span class="cost">${fmtIdle(cost)} ${resourceLabel || "Revenue"}</span></button>`;
}

function renderIdle(){
  const memo = document.getElementById("memo");
  const reqAdj = requiredAdjuncts();
  const reqStaff = requiredOfficeStaff();
  const reqAssessmentService = requiredServiceForAssessment();
  const shortAdj = IDLE.adjuncts < reqAdj;
  const shortStaff = IDLE.officeStaff < reqStaff;
  const shortService = IDLE.service < reqAssessmentService;
  const isShort = shortAdj || shortStaff || shortService;

  let warningHtml = "";
  if(IDLE.collapseNotice){
    warningHtml = `<div class="idle-warning">${IDLE.collapseNotice}</div>`;
    IDLE.collapseNotice = null;
  } else if(isShort){
    const elapsed = IDLE.understaffedSince ? Math.floor((Date.now() - IDLE.understaffedSince) / 1000) : 0;
    const remaining = Math.max(0, UNDERSTAFFED_GRACE_SECONDS - elapsed);
    const parts = [];
    if(shortAdj) parts.push("not enough Adjuncts covering sections");
    if(shortStaff) parts.push("the office can't keep up with the paperwork");
    if(shortService) parts.push("program assessments are overdue for lack of Service faculty");
    warningHtml = `<div class="idle-warning">UNDERSTAFFED &mdash; ${parts.join(", ")}. Production is cut in half. The department collapses in ${remaining}s if this isn't fixed.</div>`;
  }

  const rates = idleRates();
  function rateNote(text){
    return `<div class="idle-section-sub idle-rate-note">${text}</div>`;
  }
  function fmtRate(n){
    return n.toFixed(n < 1 ? 3 : 2);
  }

  const facultyCost = idleCost(IDLE_HIRE_DEFS.faculty.baseCost, IDLE_HIRE_DEFS.faculty.ratio, IDLE.faculty);
  const adjunctCost = idleCost(IDLE_HIRE_DEFS.adjunct.baseCost, IDLE_HIRE_DEFS.adjunct.ratio, IDLE.adjuncts);
  const staffCost = idleCost(IDLE_HIRE_DEFS.officeStaff.baseCost, IDLE_HIRE_DEFS.officeStaff.ratio, IDLE.officeStaff);
  const officeCost = idleCost(IDLE_BUILDING_DEFS.facultyOffice.baseCost, IDLE_BUILDING_DEFS.facultyOffice.ratio, IDLE.facultyOffice);
  const classroomCost = idleCost(IDLE_BUILDING_DEFS.classroom.baseCost, IDLE_BUILDING_DEFS.classroom.ratio, IDLE.classroom);
  const programCost = idleCost(IDLE_BUILDING_DEFS.academicProgram.baseCost, IDLE_BUILDING_DEFS.academicProgram.ratio, IDLE.academicProgram);
  const labCost = idleCost(IDLE_BUILDING_DEFS.lab.baseCost, IDLE_BUILDING_DEFS.lab.ratio, IDLE.lab);
  const projectedRep = computeReputationGain(IDLE.lifetimeEarned);

  const TIER2_PROGRAMS_REQUIRED = 5;
  const tier2Unlocked = IDLE.lab >= 1 && IDLE.academicProgram >= TIER2_PROGRAMS_REQUIRED;
  const researchCenterCost = idleCost(IDLE_BUILDING_DEFS.researchCenter.baseCost, IDLE_BUILDING_DEFS.researchCenter.ratio, IDLE.researchCenter);
  const doctoralCost = idleCost(IDLE_BUILDING_DEFS.doctoralProgram.baseCost, IDLE_BUILDING_DEFS.doctoralProgram.ratio, IDLE.doctoralProgram);
  const devOfficeCost = idleCost(IDLE_BUILDING_DEFS.developmentOffice.baseCost, IDLE_BUILDING_DEFS.developmentOffice.ratio, IDLE.developmentOffice);
  const libraryCost = idleCost(IDLE_BUILDING_DEFS.library.baseCost, IDLE_BUILDING_DEFS.library.ratio, IDLE.library);
  const gradCost = idleCost(IDLE_HIRE_DEFS.gradStudent.baseCost, IDLE_HIRE_DEFS.gradStudent.ratio, IDLE.gradStudents);

  const TIER3_PRESTIGE_REQUIRED = 50;
  const tier3Unlocked = tier2Unlocked && IDLE.prestige >= TIER3_PRESTIGE_REQUIRED;
  // Dev Mode forces every rate-transparency note to show regardless of the
  // Tier 3 unlock — it only affects visibility of numbers, never the actual
  // progression gates (tier2Unlocked/tier3Unlocked/etc. are untouched).
  const showRates = tier3Unlocked || DEV_MODE;
  const commOfficeCost = idleCost(IDLE_BUILDING_DEFS.communicationsOffice.baseCost, IDLE_BUILDING_DEFS.communicationsOffice.ratio, IDLE.communicationsOffice);
  const satelliteCost = idleCost(IDLE_BUILDING_DEFS.satelliteCampus.baseCost, IDLE_BUILDING_DEFS.satelliteCampus.ratio, IDLE.satelliteCampus);

  const TIER4_PRESTIGE_REQUIRED = 200;
  const tier4Unlocked = tier3Unlocked && IDLE.satelliteCampus >= 1 && IDLE.prestige >= TIER4_PRESTIGE_REQUIRED;
  const govRelationsCost = idleCost(IDLE_BUILDING_DEFS.governmentRelations.baseCost, IDLE_BUILDING_DEFS.governmentRelations.ratio, IDLE.governmentRelations);
  const systemCampusCost = idleCost(IDLE_BUILDING_DEFS.systemCampus.baseCost, IDLE_BUILDING_DEFS.systemCampus.ratio, IDLE.systemCampus);
  const chancellorCost = idleCost(IDLE_BUILDING_DEFS.chancellorOffice.baseCost, IDLE_BUILDING_DEFS.chancellorOffice.ratio, IDLE.chancellorOffice);

  const TIER5_REPUTATION_REQUIRED = 50;
  const tier5Unlocked = tier4Unlocked && IDLE.chancellorOffice >= 1 && IDLE.reputation >= TIER5_REPUTATION_REQUIRED;
  const accredCouncilCost = idleCost(IDLE_BUILDING_DEFS.accreditationCouncil.baseCost, IDLE_BUILDING_DEFS.accreditationCouncil.ratio, IDLE.accreditationCouncil);
  const accreditingBodyCost = idleCost(IDLE_BUILDING_DEFS.accreditingBody.baseCost, IDLE_BUILDING_DEFS.accreditingBody.ratio, IDLE.accreditingBody);
  const edTechDivisionCost = idleCost(IDLE_BUILDING_DEFS.edTechDivision.baseCost, IDLE_BUILDING_DEFS.edTechDivision.ratio, IDLE.edTechDivision);

  memo.innerHTML = `
    ${renderLetterhead("NEW APPOINTMENT &mdash; DEPARTMENT BUILDING")}
    ${warningHtml}
    <div class="idle-resources">
      <div class="idle-res"><span class="lbl">Tuition</span><span class="val">${fmtIdle(IDLE.tuition)}</span></div>
      <div class="idle-res"><span class="lbl">Revenue</span><span class="val">$${fmtIdle(IDLE.revenue)}</span></div>
      <div class="idle-res"><span class="lbl">Majors</span><span class="val">${fmtIdle(IDLE.majors)}</span></div>
      <div class="idle-res"><span class="lbl">Seats</span><span class="val">${fmtIdle(IDLE.seats)}</span></div>
      <div class="idle-res"><span class="lbl">Grants</span><span class="val">${fmtIdle(IDLE.grants)}</span></div>
      <div class="idle-res"><span class="lbl">Publications</span><span class="val">${fmtIdle(IDLE.publications)}</span></div>
      ${tier2Unlocked ? `<div class="idle-res"><span class="lbl">Endowment</span><span class="val">${fmtIdle(IDLE.endowment)}</span></div>` : ""}
      ${tier2Unlocked ? `<div class="idle-res"><span class="lbl">Prestige</span><span class="val">${fmtIdle(IDLE.prestige)}</span></div>` : ""}
      ${tier3Unlocked ? `<div class="idle-res"><span class="lbl">PR</span><span class="val">${fmtIdle(IDLE.pr)}</span></div>` : ""}
      ${tier4Unlocked ? `<div class="idle-res"><span class="lbl">State Funding</span><span class="val">${fmtIdle(IDLE.stateFunding)}</span></div>` : ""}
      ${tier5Unlocked ? `<div class="idle-res"><span class="lbl">Accreditation Standards</span><span class="val">${fmtIdle(IDLE.accredStandards)}</span></div>` : ""}
      ${tier5Unlocked ? `<div class="idle-res"><span class="lbl">Ed-Tech Contracts</span><span class="val">${fmtIdle(IDLE.edTechContracts)}</span></div>` : ""}
      <div class="idle-res rep"><span class="lbl">Reputation</span><span class="val">${IDLE.reputation}</span></div>
    </div>
    ${rateNote(`Tuition is gross income raised to date and is never spent directly. Revenue is your actual budget — Tuition plus indirect cost recovery from Grants flow into it, and it's what pays for every hire and building below.`)}
    ${!IDLE.semesterStarted ? `
    <div class="idle-section">
      <div class="idle-section-title">Before the Semester Begins</div>
      <div class="idle-section-sub">The administration has authorized a one-time startup budget of $${fmtIdle(STARTING_LUMP_SUM)}, already added to Revenue above. Spend it on Faculty, Adjuncts, Office Staff, and buildings below to minimally staff the department &mdash; nothing accrues and no one can collapse from understaffing until you start the clock.</div>
      <button class="continue-btn" id="beginSemesterBtn">Start the Semester</button>
    </div>
    ` : `
    <div class="idle-morale">
      <div class="gauge-label"><span>Faculty Morale</span><span>${Math.round(IDLE.morale)}</span></div>
      <div class="gauge-track"><div class="gauge-fill ${gaugeClass(IDLE.morale)}" style="width:${IDLE.morale}%"></div></div>
    </div>
    ${showRates ? rateNote(`The books are open now &mdash; every line below shows exactly what it's worth. Combined output right now: ${fmtRate(rates.totalRate)}/s across all resources, which is what your next Reputation gain (${projectedRep}) is calculated from.`) : ""}

    <button class="continue-btn" id="recruitBtn">Recruit a Student (+1 Seat)</button>
    `}

    <div class="idle-section">
      <div class="idle-section-title">Faculty &mdash; ${IDLE.faculty} hired / ${IDLE.facultyOffice} offices</div>
      <div class="idle-jobs">
        <div class="job-row"><span>Teaching: ${IDLE.teaching}${showRates ? ` (+${fmtRate(rates.perTeaching)} Majors/s, +${fmtRate(rates.perTeaching * SEATS_PER_MAJOR)} Seats/s each)` : ""}</span><span><button class="job-btn" data-from="teaching" data-to="research">&rarr; Research</button><button class="job-btn" data-from="teaching" data-to="service">&rarr; Service</button></span></div>
        <div class="job-row"><span>Research: ${IDLE.research}${showRates ? ` (${IDLE.lab > 0 ? `+${fmtRate(rates.perResearchGrants)} Grants/s, capped at ${GRANT_CAP_PER_FACULTY} each` : "no Lab yet for Grants"} + ${fmtRate(rates.perResearchPub)} Publications/s each &mdash; both also lift Morale)` : ""}</span><span><button class="job-btn" data-from="research" data-to="teaching">&rarr; Teaching</button><button class="job-btn" data-from="research" data-to="service">&rarr; Service</button></span></div>
        <div class="job-row"><span>Service: ${IDLE.service}${IDLE.academicProgram > 0 ? ` (need ${reqAssessmentService}+ for assessments)` : ""}${showRates ? ` (+${fmtRate(rates.perService)} Morale/s each)` : ""}</span><span><button class="job-btn" data-from="service" data-to="teaching">&rarr; Teaching</button><button class="job-btn" data-from="service" data-to="research">&rarr; Research</button></span></div>
      </div>
      ${idleBuyBtn("hireFacultyBtn", "Hire Faculty", facultyCost, IDLE.revenue >= facultyCost, IDLE.faculty >= IDLE.facultyOffice)}
      ${IDLE.faculty >= IDLE.facultyOffice ? `<div class="idle-section-sub idle-button-note">No open offices &mdash; build another Faculty Office first.</div>` : ""}
    </div>

    <div class="idle-section">
      <div class="idle-section-title">Adjuncts &mdash; ${IDLE.adjuncts} (need ${reqAdj}+)</div>
      <div class="idle-section-sub">Always teaching. No office required &mdash; they share whatever space is left.</div>
      ${showRates ? rateNote(`+${fmtRate(rates.perAdjunct)} Majors/s, +${fmtRate(rates.perAdjunct * SEATS_PER_MAJOR)} Seats/s each`) : ""}
      ${idleBuyBtn("hireAdjunctBtn", "Hire Adjunct", adjunctCost, IDLE.revenue >= adjunctCost)}
    </div>

    <div class="idle-section">
      <div class="idle-section-title">Office Staff &mdash; ${IDLE.officeStaff} (need ${reqStaff}+)</div>
      <div class="idle-section-sub">The administrative glue.</div>
      ${idleBuyBtn("hireStaffBtn", "Hire Office Staff", staffCost, IDLE.revenue >= staffCost)}
    </div>

    <div class="idle-section">
      <div class="idle-section-title">Buildings</div>
      ${idleBuyBtn("buildOfficeBtn", `Faculty Office (${IDLE.facultyOffice})`, officeCost, IDLE.revenue >= officeCost)}
      ${showRates ? rateNote(`Classroom: +${fmtRate(rates.perClassroom)} Majors/s, +${fmtRate(rates.perClassroom * SEATS_PER_MAJOR)} Seats/s each &middot; Academic Program: +10% recruiting multiplier each &middot; Lab: +${fmtRate(rates.perResearchGrants)} Grants/s per Research faculty (capped at ${GRANT_CAP_PER_FACULTY} each) &middot; Tuition itself is $${TUITION_PER_SEAT_PER_SECOND}/Seat/s`) : ""}
      ${showRates ? rateNote(`Average grant size: $${fmtIdle(rates.avgGrantValue)} (grows with Publications &amp; Reputation, capped at $${fmtIdle(GRANT_VALUE_CAP)}) &middot; Indirect cost rate: ${Math.round(INDIRECT_COST_RATE * 100)}% of grant $ recovered as Revenue &middot; Revenue = Tuition + Indirect Costs`) : ""}
      ${idleBuyBtn("buildClassroomBtn", `Classroom (${IDLE.classroom})`, classroomCost, IDLE.revenue >= classroomCost)}
      ${idleBuyBtn("buildProgramBtn", `Academic Program (${IDLE.academicProgram})`, programCost, IDLE.revenue >= programCost)}
      ${idleBuyBtn("buildLabBtn", `Lab (${IDLE.lab})`, labCost, IDLE.revenue >= labCost)}
      ${!tier2Unlocked ? `<div class="idle-section-sub idle-button-note">Becoming a School needs a Lab (${IDLE.lab >= 1 ? "&#10003;" : "&mdash;"}) and ${TIER2_PROGRAMS_REQUIRED} Academic Programs (${IDLE.academicProgram}/${TIER2_PROGRAMS_REQUIRED}).</div>` : ""}
    </div>

    ${tier2Unlocked ? `
    <div class="idle-section">
      <div class="idle-section-title">School &amp; College</div>
      ${showRates ? rateNote(`Research Center: +${fmtRate(rates.perResearchPubBoost)} bonus Publications/s per Research faculty, on top of the base rate &middot; Development Office: +${fmtRate(rates.perDevOffice)} Endowment/s each &middot; Library: +5% global multiplier each`) : ""}
      ${idleBuyBtn("buildResearchCenterBtn", `Research Center (${IDLE.researchCenter})`, researchCenterCost, IDLE.grants >= researchCenterCost, false, "Grants")}
      ${IDLE.doctoralProgram >= 1
        ? `<div class="idle-established">Doctoral Program &mdash; established</div>`
        : idleBuyBtn("buildDoctoralBtn", "Doctoral Program", doctoralCost, IDLE.publications >= doctoralCost, false, "Publications")}
      ${idleBuyBtn("buildDevOfficeBtn", `Development Office (${IDLE.developmentOffice})`, devOfficeCost, IDLE.revenue >= devOfficeCost)}
      ${idleBuyBtn("buildLibraryBtn", `Library (${IDLE.library})`, libraryCost, IDLE.endowment >= libraryCost, false, "Endowment")}
    </div>

    ${IDLE.doctoralProgram >= 1 ? `
    <div class="idle-section">
      <div class="idle-section-title">Grad Students &mdash; ${IDLE.gradStudents}</div>
      <div class="idle-section-sub">Cheap labor. TAs help teach, RAs help research.</div>
      <div class="idle-jobs">
        <div class="job-row"><span>TA: ${IDLE.ta}${showRates ? ` (+${fmtRate(rates.perTA)} Majors/s, +${fmtRate(rates.perTA * SEATS_PER_MAJOR)} Seats/s each)` : ""}</span><span><button class="job-btn" data-from="ta" data-to="ra">&rarr; RA</button></span></div>
        <div class="job-row"><span>RA: ${IDLE.ra}${showRates ? ` (${IDLE.researchCenter > 0 ? `+${fmtRate(rates.perRA)} Publications/s` : "needs a Research Center"} each)` : ""}</span><span><button class="job-btn" data-from="ra" data-to="ta">&rarr; TA</button></span></div>
      </div>
      ${idleBuyBtn("hireGradBtn", "Hire Grad Student", gradCost, IDLE.revenue >= gradCost)}
    </div>` : ""}

    ${!tier3Unlocked ? `<div class="idle-section-sub idle-button-note">Growing university-wide needs ${TIER3_PRESTIGE_REQUIRED} Prestige (${fmtIdle(IDLE.prestige)}/${TIER3_PRESTIGE_REQUIRED}).</div>` : ""}

    ${tier3Unlocked ? `
    <div class="idle-section">
      <div class="idle-section-title">University-wide Influence</div>
      ${rateNote(`Communications Office: +${fmtRate(rates.perCommOffice)} PR/s each (PR boosts recruiting, growing Majors and Seats faster) &middot; Satellite Campus: +20% global multiplier each`)}
      ${idleBuyBtn("buildCommOfficeBtn", `Communications Office (${IDLE.communicationsOffice})`, commOfficeCost, IDLE.endowment >= commOfficeCost, false, "Endowment")}
      ${idleBuyBtn("buildSatelliteBtn", `Satellite Campus (${IDLE.satelliteCampus})`, satelliteCost, IDLE.prestige >= satelliteCost, false, "Prestige")}
    </div>

    ${!tier4Unlocked ? `<div class="idle-section-sub idle-button-note">Growing into a statewide system needs a Satellite Campus (${IDLE.satelliteCampus >= 1 ? "&#10003;" : "&mdash;"}) and ${TIER4_PRESTIGE_REQUIRED} Prestige (${fmtIdle(IDLE.prestige)}/${TIER4_PRESTIGE_REQUIRED}).</div>` : ""}

    ${tier4Unlocked ? `
    <div class="idle-section">
      <div class="idle-section-title">Statewide University System</div>
      ${rateNote(`Government Relations Office: +${fmtRate(rates.perGovRelations)} State Funding/s each &middot; System Campus: +25% global multiplier each &middot; Chancellor's Office: +50% global multiplier, one time`)}
      ${idleBuyBtn("buildGovRelationsBtn", `Government Relations Office (${IDLE.governmentRelations})`, govRelationsCost, IDLE.prestige >= govRelationsCost, false, "Prestige")}
      ${idleBuyBtn("buildSystemCampusBtn", `System Campus (${IDLE.systemCampus})`, systemCampusCost, IDLE.stateFunding >= systemCampusCost, false, "State Funding")}
      ${IDLE.chancellorOffice >= 1
        ? `<div class="idle-established">Chancellor's Office &mdash; established</div>`
        : idleBuyBtn("buildChancellorBtn", "Chancellor's Office", chancellorCost, IDLE.stateFunding >= chancellorCost, false, "State Funding")}
    </div>

    ${!tier5Unlocked ? `<div class="idle-section-sub idle-button-note">Founding your own accrediting body needs a Chancellor's Office (${IDLE.chancellorOffice >= 1 ? "&#10003;" : "&mdash;"}) and ${TIER5_REPUTATION_REQUIRED} lifetime Reputation (${IDLE.reputation}/${TIER5_REPUTATION_REQUIRED}).</div>` : ""}

    ${tier5Unlocked ? `
    <div class="idle-section">
      <div class="idle-section-title">Your Own Accrediting Body</div>
      ${rateNote(`Accreditation Council: +${fmtRate(rates.perAccredCouncil)} Accreditation Standards/s each &middot; Accrediting Body: +100% global multiplier, one time &middot; Ed-Tech Division: +${fmtRate(rates.perEdTechDivision)} Ed-Tech Contracts/s each`)}
      ${idleBuyBtn("buildAccredCouncilBtn", `Accreditation Council (${IDLE.accreditationCouncil})`, accredCouncilCost, IDLE.stateFunding >= accredCouncilCost, false, "State Funding")}
      ${IDLE.accreditingBody >= 1
        ? `<div class="idle-established">Accrediting Body &mdash; established</div>`
        : idleBuyBtn("buildAccreditingBodyBtn", "Accrediting Body", accreditingBodyCost, IDLE.accredStandards >= accreditingBodyCost, false, "Accreditation Standards")}
      ${IDLE.accreditingBody >= 1
        ? idleBuyBtn("buildEdTechBtn", `Ed-Tech Division (${IDLE.edTechDivision})`, edTechDivisionCost, IDLE.accredStandards >= edTechDivisionCost, false, "Accreditation Standards")
        : `<div class="idle-section-sub idle-button-note">Requires the Accrediting Body.</div>`}
    </div>

    ${canSellTheStack()
      ? `<button class="idle-prestige-btn" id="sellStackBtn" style="border-style:solid; font-weight:700;">SELL THE WHOLE STACK &mdash; exit and start over, elsewhere</button>`
      : `<div class="idle-section-sub idle-button-note">Selling the stack needs the Accrediting Body and ${SELL_STACK_EDTECH_REQUIRED} Ed-Tech Contracts (${fmtIdle(IDLE.edTechContracts)}/${SELL_STACK_EDTECH_REQUIRED}).</div>`}
    ` : ""}
    ` : ""}
    ` : ""}
    ` : ""}

    ${IDLE.semesterStarted ? `<button class="idle-prestige-btn" id="prestigeBtn">Move to a New University &mdash; bank ${projectedRep} Reputation and start over</button>` : ""}
  `;

  const beginSemesterBtn = document.getElementById("beginSemesterBtn");
  if(beginSemesterBtn) beginSemesterBtn.onclick = beginSemester;
  const recruitBtn = document.getElementById("recruitBtn");
  if(recruitBtn) recruitBtn.onclick = recruitStudent;
  document.getElementById("hireFacultyBtn").onclick = hireFaculty;
  document.getElementById("hireAdjunctBtn").onclick = hireAdjunct;
  document.getElementById("hireStaffBtn").onclick = hireOfficeStaff;
  document.getElementById("buildOfficeBtn").onclick = () => buildIdleBuilding("facultyOffice");
  document.getElementById("buildClassroomBtn").onclick = () => buildIdleBuilding("classroom");
  document.getElementById("buildProgramBtn").onclick = () => buildIdleBuilding("academicProgram");
  document.getElementById("buildLabBtn").onclick = () => buildIdleBuilding("lab");
  const prestigeBtn = document.getElementById("prestigeBtn");
  if(prestigeBtn) prestigeBtn.onclick = doPrestige;
  if(tier2Unlocked){
    document.getElementById("buildResearchCenterBtn").onclick = () => buildIdleBuilding("researchCenter");
    document.getElementById("buildDevOfficeBtn").onclick = () => buildIdleBuilding("developmentOffice");
    document.getElementById("buildLibraryBtn").onclick = () => buildIdleBuilding("library");
    const doctoralBtn = document.getElementById("buildDoctoralBtn");
    if(doctoralBtn) doctoralBtn.onclick = () => buildIdleBuilding("doctoralProgram");
    const gradBtn = document.getElementById("hireGradBtn");
    if(gradBtn) gradBtn.onclick = hireGradStudent;
  }
  if(tier3Unlocked){
    document.getElementById("buildCommOfficeBtn").onclick = () => buildIdleBuilding("communicationsOffice");
    document.getElementById("buildSatelliteBtn").onclick = () => buildIdleBuilding("satelliteCampus");
  }
  if(tier4Unlocked){
    document.getElementById("buildGovRelationsBtn").onclick = () => buildIdleBuilding("governmentRelations");
    document.getElementById("buildSystemCampusBtn").onclick = () => buildIdleBuilding("systemCampus");
    const chancellorBtn = document.getElementById("buildChancellorBtn");
    if(chancellorBtn) chancellorBtn.onclick = () => buildIdleBuilding("chancellorOffice");
  }
  if(tier5Unlocked){
    document.getElementById("buildAccredCouncilBtn").onclick = () => buildIdleBuilding("accreditationCouncil");
    const accreditingBodyBtn = document.getElementById("buildAccreditingBodyBtn");
    if(accreditingBodyBtn) accreditingBodyBtn.onclick = () => buildIdleBuilding("accreditingBody");
    const edTechBtn = document.getElementById("buildEdTechBtn");
    if(edTechBtn) edTechBtn.onclick = () => buildIdleBuilding("edTechDivision");
    const sellStackBtn = document.getElementById("sellStackBtn");
    if(sellStackBtn) sellStackBtn.onclick = sellTheStack;
  }
  document.querySelectorAll(".job-btn").forEach(btn => {
    btn.onclick = () => reassignFaculty(btn.dataset.from, btn.dataset.to);
  });
}

(function initDevModeToggle(){
  const toggleEl = document.getElementById("devModeToggle");
  const checkbox = document.getElementById("devModeCheckbox");
  checkbox.checked = DEV_MODE;
  toggleEl.classList.toggle("active", DEV_MODE);
  checkbox.onchange = () => {
    DEV_MODE = checkbox.checked;
    try{ localStorage.setItem(DEV_MODE_KEY, DEV_MODE ? "1" : "0"); }catch(e){}
    toggleEl.classList.toggle("active", DEV_MODE);
    if(IDLE) renderIdle();
  };
})();

renderStart();
</script>
</body>
</html>
